  --radius:20px;
  --font:"Andika", Verdana, "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:20px; line-height:1.6;
  letter-spacing:.12em; word-spacing:.16em;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh; min-height:100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font-family:inherit; letter-spacing:inherit; color:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; cursor:pointer}
button:focus-visible{outline:4px solid #F2A900; outline-offset:3px}
.emoji{font-family:var(--emoji); letter-spacing:0; line-height:1; font-style:normal}
.wrap{max-width:760px; margin:0 auto; padding:12px 16px 40px}

/* Top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0 10px}
.home-btn{display:flex; align-items:center; gap:8px; background:#fff; border:3px solid var(--line); border-radius:16px; padding:8px 14px; font-size:20px; font-weight:700; min-height:56px}
.title{font-size:22px; font-weight:700; text-align:center; flex:1; line-height:1.3}
.stars{display:inline-flex; align-items:center; gap:6px; background:#fff; border:3px solid #F5D98B; border-radius:999px; padding:6px 14px; font-weight:700; font-size:22px; min-height:52px; white-space:nowrap}
.stars.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

/* Home */
.hello{font-size:44px; font-weight:700; margin:6px 0 0; line-height:1.3}
.sub{font-size:21px; color:var(--ink-soft); margin:2px 0 16px}
.modes{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.mode{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:150px; border-radius:24px; border:3px solid rgba(0,0,0,.12); box-shadow:0 5px 0 rgba(0,0,0,.14); font-size:22px; font-weight:700; padding:12px 8px; line-height:1.25; text-align:center}
.mode:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.14)}
.mode .emoji{font-size:58px}
.mode.wide{grid-column:1 / -1; min-height:120px; flex-direction:row; gap:18px}
.m-learn{background:#D4E9FF}.m-build{background:#FFE2B8}.m-hunt{background:#D8F3D2}.m-math{background:#F1DDFA}.m-quiz{background:#FFF1A8}
.grown-link{display:block; margin:26px auto 0; background:transparent; border:2px dashed #C9BB98; border-radius:14px; padding:10px 18px; font-size:18px; color:var(--ink-soft)}

/* Cards and big words */
.card{background:var(--card); border:3px solid var(--line); border-radius:28px; padding:18px 14px; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.06)}
.pic{font-size:88px; line-height:1.1; margin:4px 0}
.bigword{font-size:clamp(72px, 22vw, 150px); font-weight:700; letter-spacing:.14em; line-height:1.15; margin:4px 0}
.v{color:var(--vowel)}
.segs{display:flex; justify-content:center; align-items:center; gap:8px; margin:8px 0 4px; flex-wrap:nowrap}
.seg{min-width:72px; height:78px; font-size:44px; font-weight:700; background:#fff; border:3px solid var(--line); border-radius:16px; padding:0 8px; letter-spacing:0}
.seg.vowel{color:var(--vowel); background:var(--vowel-bg); border-color:#B9D2F1}
.seg.lit{background:#FFF3B0; border-color:#F2A900; transform:scale(1.08)}
.dash{font-size:34px; color:#999; letter-spacing:0}
.note{font-size:18px; background:var(--vowel-bg); border-radius:14px; padding:10px 12px; margin:12px 0 0; line-height:1.5; text-align:left}
.sentence{font-size:19px; color:var(--ink-soft); margin:10px 0 0}

/* Buttons */
.row{display:flex; gap:12px; justify-content:center; margin:14px 0 0; flex-wrap:wrap}
.btn{min-height:68px; padding:10px 20px; border-radius:var(--radius); border:3px solid var(--btn-dark); background:var(--btn); color:#fff; font-size:24px; font-weight:700; box-shadow:0 5px 0 var(--btn-dark); display:inline-flex; align-items:center; justify-content:center; gap:10px; line-height:1.2}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--btn-dark)}
.btn.alt{background:#fff; color:var(--ink); border-color:#BFAF8A; box-shadow:0 5px 0 #BFAF8A}
.btn.go{background:var(--good); border-color:#1D5A21; box-shadow:0 5px 0 #1D5A21}
.btn.huge{font-size:30px; min-height:84px; padding:12px 28px}
.btn.speak{font-size:26px; min-height:88px; min-width:110px; white-space:nowrap}
.btn.speak .emoji{font-size:40px}
.btn[disabled]{opacity:.45}
.btn.flex1{flex:1 1 140px}
.navrow{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px}
.navrow .count{font-size:20px; color:var(--ink-soft)}
.arrow{width:92px; min-height:72px}
.arrow svg{width:34px; height:34px}

/* Feedback */
.feedback{min-height:64px; margin:14px 0 0; border-radius:18px; padding:12px; font-size:24px; font-weight:700; text-align:center; line-height:1.35}
.feedback.good{background:var(--good-bg); color:#1D5A21}
.feedback.gentle{background:var(--gentle-bg); color:var(--gentle)}
.feedback.show{background:var(--vowel-bg); color:#173F73}
.progress{display:flex; gap:6px; justify-content:center; margin:0 0 10px; flex-wrap:wrap}
.progress i{width:14px; height:14px; border-radius:50%; background:#E7DCC2; display:block}
.progress i.done{background:var(--star)}
.progress i.now{background:var(--btn); transform:scale(1.3)}
.prompt{font-size:22px; margin:4px 0 8px; text-align:center}

/* Build the word */
.boxes{display:flex; justify-content:center; gap:12px; margin:14px 0}
.box{width:92px; height:104px; border:4px dashed #BFAF8A; border-radius:18px; background:#fff; font-size:60px; font-weight:700; display:flex; align-items:center; justify-content:center; letter-spacing:0; padding:0}
.box.filled{border-style:solid; border-color:#8FA9C9}
.box.right{border-color:var(--good); background:var(--good-bg)}
.box.v{color:var(--vowel)}
.tiles{display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin:8px auto 0; max-width:420px}
.tile{width:84px; height:88px; background:#fff; border:3px solid #BFAF8A; border-radius:18px; box-shadow:0 5px 0 #BFAF8A; font-size:52px; font-weight:700; letter-spacing:0; padding:0}
.tile:active{transform:translateY(3px); box-shadow:0 2px 0 #BFAF8A}
.tile.v{color:var(--vowel)}
.tile.used{visibility:hidden}

/* Word hunt */
.choices{display:grid; grid-template-columns:1fr; gap:14px; margin-top:14px}
.choice{min-height:96px; font-size:54px; font-weight:700; background:#fff; border:3px solid #BFAF8A; border-radius:22px; box-shadow:0 5px 0 #BFAF8A; letter-spacing:.14em}
.choice:active{transform:translateY(3px); box-shadow:0 2px 0 #BFAF8A}
.choice.faded{opacity:.35; box-shadow:none}
.choice.right{background:var(--good-bg); border-color:var(--good); box-shadow:0 5px 0 var(--good)}

/* Math */
.problem{font-size:clamp(56px, 17vw, 100px); font-weight:700; letter-spacing:0; line-height:1.1; margin:0 0 6px; white-space:nowrap}
.problem .op{margin:0 .18em}
.mathcard{padding:12px 10px}
.count-btn{font-size:17px; min-height:48px; padding:4px 12px; border-radius:14px; box-shadow:0 4px 0 #BFAF8A}
.dots-cap{display:flex; align-items:center; justify-content:center; gap:6px 12px; flex-wrap:wrap; margin:0 0 4px}
.numline .nexttxt.on{fill:#B35F00}
.grown{letter-spacing:.05em}
.problem .q{color:var(--vowel)}
.dots-area{display:flex; align-items:center; justify-content:center; gap:14px; margin:8px 0; flex-wrap:nowrap}
.dotrows{display:flex; flex-direction:column; gap:6px}
.dotrow{display:flex; gap:7px}
.dotgrp{display:flex; gap:7px; padding:5px; border-radius:12px; background:#EEF3FA}
.dotc{width:26px; height:26px; border-radius:50%; background:var(--dot); display:block; border:0; padding:0}
.dotc.plus{background:var(--dot-plus); width:34px; height:34px}
.dotc.lit{box-shadow:0 0 0 5px #F2A900}
.plus-sign{font-size:40px; font-weight:700; letter-spacing:0}
.dots-cap{font-size:19px; color:var(--ink-soft); margin:0}
.numline{width:100%; max-width:460px; display:block; margin:0 auto}
.numline text{font-family:var(--font); font-weight:700; letter-spacing:0}
.answers{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px}
.answer{min-height:100px; font-size:56px; font-weight:700; background:#fff; border:3px solid #BFAF8A; border-radius:22px; box-shadow:0 5px 0 #BFAF8A; letter-spacing:.04em}
.answer:active{transform:translateY(3px); box-shadow:0 2px 0 #BFAF8A}
.answer.faded{opacity:.35; box-shadow:none}
.answer.right{background:var(--good-bg); border-color:var(--good); box-shadow:0 5px 0 var(--good)}
.helper{background:#FFF3B0; color:var(--ink); border:3px solid #E9C95A; box-shadow:0 5px 0 #E9C95A; font-size:19px; min-height:88px; padding:8px 12px; letter-spacing:.06em}
.hop{opacity:0; transition:opacity .4s}
.hop.on{opacity:1}

/* End screen */
.end{text-align:center; padding:10px 0}
.end h2{font-size:40px; margin:6px 0; line-height:1.25}
.starrow{display:flex; flex-wrap:wrap; justify-content:center; gap:4px; font-size:36px; letter-spacing:0; line-height:1.3; margin:10px 0}
.practice-list{font-size:20px; color:var(--ink-soft)}

/* Grown-ups */
.grown{line-height:1.7; font-size:18px; text-align:left}
.grown h2{font-size:26px; margin:18px 0 6px}
.grown h3{font-size:21px; margin:16px 0 4px}
.grown p, .grown li{max-width:65ch}
.grown ul{padding-left:1.2em}
.grown table{border-collapse:collapse; width:100%; font-size:17px; background:#fff; border-radius:12px; overflow:hidden}
.grown th, .grown td{border-bottom:1px solid var(--line); padding:8px 6px; text-align:left}
.grown th{background:#F7EED8}
.tip{background:#fff; border:2px solid var(--line); border-radius:14px; padding:10px 14px; margin:10px 0}
.nospeech{background:var(--gentle-bg); color:var(--gentle); border-radius:14px; padding:10px 14px; font-size:18px; margin:10px 0; display:none}
.nospeech.on{display:block}

.fly{position:fixed; font-size:54px; pointer-events:none; z-index:50; animation:fly 1s ease-in forwards}
@keyframes fly{0%{opacity:1; transform:translate(0,0) scale(1)}100%{opacity:0; transform:translate(var(--dx), var(--dy)) scale(.4)}}

@media (min-width:700px){
  .modes{grid-template-columns:1fr 1fr 1fr}
  .mode.wide{grid-column:auto; flex-direction:column; min-height:150px; gap:6px}
  .choices{grid-template-columns:1fr 1fr 1fr}
  .answers{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:360px){
  body{font-size:18px}
  .tile{width:72px; height:80px; font-size:46px}
  .box{width:80px; height:94px; font-size:52px}
  .dotc{width:22px; height:22px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}

/* Build the word: Undo */
.undo-row{margin:0 0 6px}
.btn.undo{min-height:72px; font-size:26px; padding:8px 26px; gap:12px}
.btn.undo svg{width:42px; height:30px}
.boxes.many{flex-wrap:wrap}
/* Pictures (emoji or a small photo) */
.picimg{height:1em; width:auto; max-width:2.4em; border-radius:.14em; vertical-align:middle; object-fit:cover}
/* Math: scaled dots, added dots, crossed-out dots */
.dotgrp.addgrp{background:#FDEBD6}
.dotc.add{background:var(--dot-plus)}
.dotc.gone{background:#AFC3DA; position:relative}
.dotc.gone::before, .dotc.gone::after{content:""; position:absolute; left:-4px; right:-4px; top:50%; height:4px; margin-top:-2px; border-radius:2px; background:#444}
.dotc.gone::before{transform:rotate(45deg)}
.dotc.gone::after{transform:rotate(-45deg)}
.dots-sm .dotc{width:20px; height:20px}
.dots-sm .dotc.plus{width:28px; height:28px}
.dots-sm .dotrow, .dots-sm .dotgrp{gap:5px}
.dots-sm .dotrows{gap:5px}
.problem.long{font-size:clamp(46px, 13.5vw, 90px)}

/* Grown-up check */
.gate{max-width:460px; margin:10px auto 0}
.gate label{display:block; font-size:28px; font-weight:700; margin:6px 0 10px; letter-spacing:.06em}
.gate input{font-family:inherit; font-size:40px; font-weight:700; text-align:center; width:170px; padding:6px 10px; border:3px solid var(--line); border-radius:16px; background:#fff; color:var(--ink); letter-spacing:.08em}
.gate input:focus{outline:4px solid #F2A900; border-color:#F2A900}

/* Edit words & math */
.ed{font-size:18px; line-height:1.55; letter-spacing:.05em; text-align:left}
.ed h2{font-size:25px; margin:22px 0 6px; line-height:1.3}
.ed .lbl{display:block; font-weight:700; margin:12px 0 4px}
.ed .hint{font-size:16px; color:var(--ink-soft); margin:4px 0 0}
.ed input[type=text], .ed select, .ed textarea{font-family:inherit; font-size:20px; letter-spacing:.05em; width:100%; padding:8px 12px; border:3px solid var(--line); border-radius:14px; background:#fff; color:var(--ink); min-height:54px}
.ed textarea{min-height:96px; font-size:15px; letter-spacing:0; line-height:1.4; font-family:ui-monospace, Menlo, Consolas, monospace; resize:vertical}
.ed textarea.plain{font-family:inherit; font-size:19px; letter-spacing:.05em}
.ed input:focus, .ed select:focus, .ed textarea:focus{outline:3px solid #F2A900; border-color:#F2A900}
.smallbtn{min-height:52px; padding:6px 14px; font-size:18px; font-weight:700; border-radius:14px; border:3px solid #BFAF8A; background:#fff; box-shadow:0 3px 0 #BFAF8A; letter-spacing:.04em; display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.smallbtn:active{transform:translateY(2px); box-shadow:0 1px 0 #BFAF8A}
.smallbtn .emoji{font-size:22px}
.wrow{background:#fff; border:3px solid var(--line); border-radius:18px; padding:10px; margin:10px 0}
.wrow.bad{border-color:#D69A1E; background:#FFF7E0}
.wrow-top, .wrow-mid{display:flex; gap:8px; align-items:center}
.wrow-mid{margin:8px 0}
.wnum{font-weight:700; color:var(--ink-soft); min-width:1.7em; text-align:right}
.ed .wrow input.w{flex:1 1 auto; min-width:0; font-size:28px; font-weight:700; letter-spacing:.14em; padding:4px 12px}
.ed .wrow input.p{flex:0 1 7em; min-width:0; text-align:center; font-family:var(--emoji); font-size:24px; letter-spacing:0}
.picprev{flex:0 0 auto; width:58px; height:54px; font-size:40px; line-height:54px; text-align:center}
.picprev .none{font-size:13px; line-height:1.2; color:var(--ink-soft); display:inline-block; letter-spacing:0}
.filebtn{position:relative; overflow:hidden; cursor:pointer}
.filebtn input{position:absolute; left:0; top:0; width:1px; height:1px; opacity:0}
.optrow{display:flex; gap:10px}
.opt{flex:1; min-height:60px; font-size:22px; font-weight:700; border-radius:16px; border:3px solid #BFAF8A; background:#fff; box-shadow:0 4px 0 #BFAF8A}
.opt.on{background:var(--vowel-bg); border-color:var(--btn); box-shadow:0 4px 0 var(--btn); color:#173F73}
.inline3{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:10px}
.preview{background:#fff; border:2px dashed var(--line); border-radius:14px; padding:8px 12px; margin:10px 0 0; font-size:17px}
.edmsg{border-radius:14px; padding:10px 14px; margin:12px 0 0; font-weight:700; font-size:18px}
.edmsg:empty{display:none}
.edmsg.ok{background:var(--good-bg); color:#1D5A21}
.edmsg.err{background:var(--gentle-bg); color:var(--gentle)}
.edmsg ul{margin:4px 0 0; padding-left:1.2em; font-weight:400}
.savebar{position:sticky; bottom:0; background:var(--bg); padding:10px 0 8px; margin-top:18px; border-top:2px solid var(--line); z-index:5}
.savebar .row{margin:0}
.dirty{font-size:16px; color:var(--gentle); text-align:center; margin:4px 0 0; min-height:1.4em}

/* ---------- Blocky mining theme (original pixel art drawn in CSS/SVG; reading text stays Andika on cream) ---------- */

.px{display:block; image-rendering:pixelated}

'1' height='1' fill='%236B4222'/%3E%3Crect x='12' y='7' width='1' height='1' fill='%237A4E24'/%3E%3Crect x='14' y='7' width='1' height='1' fill='%237A4E24'/%3E%3Crect x='3' y='8' width='1' height='1' fill='%237A4E24'/%3E%3Crect x='6' y='7' width='1' height='1' fill='%237A4E24'/%3E%3Crect x='7' y='8' width='1' height='1' fill='%23A87440'/%3E%3Crect x='15' y='5' width='1' height='1' fill='%237A4E24'/%3E%3Crect x='14' y='8' width='1' height='1' fill='%236B4222'/%3E%3C/svg%3E") repeat-x; background-size:48px 30px; image-rendering:pixelated}
.hello, .title, .end h2, .craftcard h2{text-shadow:2px 2px 0 #D7E8C4}
.hello{text-shadow:3px 3px 0 #CFE3B5}
.home-btn{border-radius:10px; box-shadow:0 3px 0 var(--line)}
.stars{border-radius:10px; border-color:var(--dirt); box-shadow:0 3px 0 var(--dirt-dark)}
.stars .pxstar{width:26px; height:26px}
.fly.pxfly svg, .fly .pxstar{width:44px; height:44px}
.starrow .pxstar{width:34px; height:34px; display:inline-block}
.card{border-radius:16px}
.mode{border-radius:10px; border:4px solid rgba(0,0,0,.26); box-shadow:inset 0 5px 0 rgba(255,255,255,.45), inset 0 -6px 0 rgba(0,0,0,.08), 0 6px 0 rgba(0,0,0,.26)}
.mode:active{box-shadow:inset 0 5px 0 rgba(255,255,255,.45), 0 2px 0 rgba(0,0,0,.26)}
.m-learn{background:#CDEBB5}.m-build{background:#F0DAB8}.m-hunt{background:#DEDED8}.m-math{background:#CBEFF6}.m-quiz{background:#FFE9A8}
.m-game{background:linear-gradient(#6DBB45 0 18px, #4E9632 18px 22px, #E2BC8A 22px)}
.m-game .px{width:62px; height:62px; margin-top:8px}
.btn, .choice, .answer, .tile, .box, .seg, .opt, .smallbtn{border-radius:10px}
.hello-row{display:flex; align-items:flex-end; justify-content:space-between; gap:8px}
.hello-row .avatar{width:92px; flex:0 0 auto; margin:-6px 0 -2px}
.crafts-link{display:flex; align-items:center; gap:8px; margin:18px auto 0; background:#fff; border:3px solid var(--dirt); box-shadow:0 4px 0 var(--dirt-dark); border-radius:10px; padding:6px 16px; font-size:20px; font-weight:700; min-height:56px}
.crafts-link .px{width:30px; height:30px}
.grown-link{margin-top:14px}

/* Avatar */
.avatar{width:84px; line-height:0}
.avatar svg{width:100%; height:auto; overflow:visible; display:block}
.avatar.big{width:120px; margin:0 auto 4px}
.av-armL, .av-armR{transition:transform .2s ease}
.avatar.hold .av-armR{transform:rotate(-30deg)}
.avatar.swing .av-armR{animation:swing .45s ease-in-out}
@keyframes swing{0%{transform:rotate(-30deg)}35%{transform:rotate(-165deg)}70%{transform:rotate(-15deg)}100%{transform:rotate(-30deg)}}
.avatar.cheer .av-armL{transform:rotate(155deg)}
.avatar.cheer .av-armR{transform:rotate(-155deg)}
.avatar.cheer svg{animation:hop .5s ease-in-out 2}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.home-av .av-armR{animation:wave 5s ease-in-out infinite 1s}
@keyframes wave{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-150deg)}82%{transform:rotate(-125deg)}88%{transform:rotate(-150deg)}94%{transform:rotate(0)}}

/* Block Mine */
.minebar{display:flex; justify-content:center; gap:5px; margin:0 0 6px}
.minebar .mb{width:26px; height:26px; background:#D9D2C0; border:3px solid #BFB39A; border-radius:4px; display:flex; align-items:center; justify-content:center; padding:1px}
.minebar .mb.now{border-color:var(--grass-dark); background:#E9F4DE}
.minebar .mb.done{background:#fff; border-color:var(--dirt)}
.minebar .mb svg{width:100%; height:100%}
.gtop{display:flex; align-items:center; gap:10px; min-height:112px}
.gtop .avatar{width:92px; flex:0 0 auto}
.gask{flex:1; display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center}
.gask .problem{font-size:clamp(40px, 11vw, 78px); margin:0}
.gask .problem.long{font-size:clamp(34px, 9vw, 70px)}
.gsay{font-size:22px; font-weight:700; margin:0; line-height:1.3; text-align:center}
.quarry{position:relative; display:flex; justify-content:space-around; align-items:center; gap:8px; padding:18px 8px 26px; margin-top:6px; border-radius:12px; overflow:hidden;
  background:linear-gradient(transparent calc(100% - 18px), #6B4222 calc(100% - 18px)), linear-gradient(#E6F2FA, #F5EEDC)}
.oreblock{position:relative; padding:0; border:0; background:none; box-shadow:0 7px 0 rgba(0,0,0,.28); border-radius:3px; line-height:0}
.oreblock .block, .oreblock .crack{position:absolute; inset:0; width:100%; height:100%}
.oreblock .block{outline:3px solid rgba(0,0,0,.28); outline-offset:-3px}
.oreblock .cs{opacity:0}
.oreblock.c1 .cs1, .oreblock.c2 .cs1, .oreblock.c2 .cs2, .oreblock.c3 .cs{opacity:1}
.oreblock .plate{position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); background:#FFF8E7; color:var(--ink); border:3px solid #3B3B3B; border-radius:6px; padding:6px 7px; font-weight:700; letter-spacing:.08em; line-height:1.1; white-space:nowrap; max-width:96%}
.oreblock:active{transform:translateY(3px); box-shadow:0 4px 0 rgba(0,0,0,.28)}
.oreblock.shake{animation:shake .55s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.oreblock.glow{box-shadow:0 0 0 5px #FFD23F, 0 0 22px 8px rgba(255,210,63,.85)}
.oreblock.glow .plate{border-color:#C98A00}
.oreblock.mined{visibility:hidden}
.shard{position:absolute; z-index:4; pointer-events:none; animation:shard .9s ease-out forwards}
@keyframes shard{0%{transform:translate(0,0)}55%{transform:translate(var(--px), var(--py))}100%{transform:translate(var(--px), calc(var(--py) + 90px)); opacity:0}}
.gfeedback{min-height:56px}
.hotbar{position:sticky; bottom:0; z-index:6; margin:12px -6px 0; padding:8px 8px 10px; background:#4A4A4A; border:4px solid #2E2E2E; border-radius:8px; box-shadow:inset 0 3px 0 #6A6A6A; color:#fff}
.hotbar .slots{display:flex; justify-content:center; gap:6px}
.hotbar .slot{position:relative; width:48px; height:48px; background:#8B8B8B; border:3px solid #BDBDBD; border-right-color:#5A5A5A; border-bottom-color:#5A5A5A; padding:5px}
.hotbar .slot.empty svg{opacity:.35; filter:grayscale(1)}
.hotbar .slot svg{width:100%; height:100%}
.hotbar .slot b{position:absolute; right:1px; bottom:-3px; font-size:17px; letter-spacing:0; color:#fff; text-shadow:2px 2px 0 #222}
.craftmeter{display:flex; align-items:center; justify-content:center; gap:7px; margin-top:6px; font-size:16px; letter-spacing:.04em; flex-wrap:wrap}
.craftmeter .px.mini{width:24px; height:24px}
.craftmeter .meter{display:inline-block; width:90px; height:12px; background:#2E2E2E; border:2px solid #BDBDBD}
.craftmeter .meter i{display:block; height:100%; background:#6DBB45}
.px.mini{width:26px; height:26px; display:inline-block; vertical-align:middle}
.recipe{display:flex; justify-content:center; flex-wrap:wrap; gap:4px; margin:8px 0}
.recipe svg{width:28px; height:28px}
.craftpop{position:fixed; inset:0; z-index:60; background:rgba(40,30,20,.55); display:flex; align-items:center; justify-content:center; padding:16px}
.craftcard{background:var(--card); border:4px solid var(--dirt); border-radius:14px; box-shadow:0 8px 0 var(--dirt-dark); padding:16px; max-width:420px; width:100%; text-align:center}
.craftcard h2{font-size:34px; margin:0 0 4px}
.craftcard p{font-size:24px; margin:6px 0}
.craftarrow{font-size:26px; color:var(--dirt); letter-spacing:0; line-height:1}
.bigitem svg{width:140px; height:140px; margin:4px auto; animation:craftin .6s ease-out}
@keyframes craftin{0%{transform:scale(.2) rotate(-30deg)}70%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:40}
.confetti i{position:absolute; width:12px; height:12px; animation:fall 3.2s ease-in forwards}
@keyframes fall{0%{transform:translateY(-70vh) rotate(0); opacity:1}85%{opacity:1}100%{transform:translateY(60vh) rotate(360deg); opacity:0}}
.shelves{margin:14px 0 0}
.shelf{display:flex; justify-content:center; gap:10px; padding:10px 8px 0; border-bottom:14px solid #9A6534; box-shadow:0 5px 0 #6B4222; margin:0 0 22px; background:#F5EAD5; border-radius:8px 8px 0 0}
.craft{width:25%; max-width:110px; text-align:center; font-size:17px; font-weight:700; letter-spacing:.04em}
.craft svg{width:100%; max-width:84px; height:auto; aspect-ratio:1; margin:0 auto}
@media (prefers-reduced-motion: reduce){ .avatar.cheer svg{animation:none} }

/* ---------- Write It ---------- */
.m-write{background:#E9DDF7}
.wtop{display:flex; align-items:center; gap:10px; margin:4px 0 8px}
.wtop .avatar{width:64px; flex:0 0 auto; margin-left:auto}
.wmode{display:flex; flex-direction:column; align-items:flex-start; gap:6px; font-size:19px; line-height:1.3}
.btn.toggle{min-height:52px; font-size:18px; padding:4px 12px; box-shadow:0 4px 0 #BFAF8A}
.btn.toggle[aria-pressed="true"]{background:var(--vowel-bg); border-color:var(--btn); color:#173F73; box-shadow:0 4px 0 var(--btn)}
.wpad{position:relative; width:100%; height:clamp(190px, 60vw, 320px); border:3px solid var(--line); border-radius:12px; background:#FFFDF7; overflow:hidden;
  touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.wpad canvas{position:absolute; left:0; top:0; display:block}
.wpad .wp-ink{touch-action:none; cursor:crosshair}
.wpad.locked .wp-ink{cursor:default}
.wtools{margin-top:10px}
.wtools .btn{min-height:60px; font-size:20px}
.wtools .btn svg{width:34px; height:24px}
.wreveal{position:relative; width:100%; height:clamp(110px, 32vw, 170px); border:3px solid #9DC39A; border-radius:12px; overflow:hidden; background:#FFFDF7}
.wreveal canvas{display:block; max-width:100%}
.wreveal.small{height:80px; border-width:2px}
.wrev{background:#fff; border:3px solid var(--line); border-radius:14px; padding:10px; margin:12px 0}
.wrev-pair{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; align-items:end}
.wrev-cell{min-width:0}
.wrev-cell .wreveal{height:84px}
.wrev-cell img{display:block; width:100%; height:84px; box-sizing:border-box; object-fit:contain; background:#FFFDF7; border:2px solid var(--line); border-radius:10px}
.wrev-lbl{display:block; white-space:nowrap; font-size:15px; color:var(--ink-soft); margin:0 0 2px}
.wrev-btns{margin-top:8px}
.wrev-btns{flex-wrap:nowrap}
.wrev-btns .btn{min-height:56px; font-size:19px; flex:1 1 0; min-width:0; white-space:nowrap; padding:8px 10px}
.wrev-btns .btn.on[data-mark="got"]{background:var(--good-bg); border-color:var(--good); box-shadow:0 4px 0 var(--good)}
.wrev-btns .btn.on[data-mark="again"]{background:var(--gentle-bg); border-color:#D69A1E; box-shadow:0 4px 0 #D69A1E}
.wsum{text-align:left; font-size:19px; margin-top:12px}
[hidden]{display:none !important}
.wtools{flex-wrap:nowrap; gap:10px; margin-top:10px}
.wtools .btn{flex:1 1 0; min-width:0; font-size:18px; min-height:56px; padding:8px 8px; gap:6px; white-space:nowrap}
.wtools .btn svg, .wtools .btn .emoji{flex:0 0 auto}
.wtools + .feedback:empty{min-height:0; padding:0; margin:4px 0 0}
.wgot .btn{font-size:23px; padding:10px 12px; line-height:1.25}
.m-write-nav .count{font-size:17px; white-space:nowrap}
/* Write It: roomier pad, fun pens, gems, bubble, burst */
.wtop{position:relative}
.wpad{height:clamp(270px, 84vw, 420px)}
.wpad .wp-fx{pointer-events:none}
.wgem{position:absolute; z-index:2; pointer-events:none; line-height:0; animation:gempop .5s ease-out both}
.wgem svg{width:100%; height:100%; display:block}
@keyframes gempop{0%{transform:translateY(16px) scale(.2); opacity:0}60%{transform:translateY(-5px) scale(1.2); opacity:1}100%{transform:translateY(0) scale(1); opacity:1}}
.pens{display:flex; align-items:center; justify-content:center; gap:10px; margin:0 0 8px}
.pens-lbl{font-size:18px; font-weight:700; color:var(--ink-soft)}
.penbtn{width:60px; height:54px; padding:6px 10px; border-radius:10px; background:#fff; border:3px solid #BFAF8A; box-shadow:0 4px 0 #BFAF8A; line-height:0}
.penbtn svg{width:100%; height:100%; display:block}
.penbtn[aria-pressed="true"]{border-color:var(--pe); box-shadow:0 4px 0 var(--pe), inset 0 0 0 3px var(--pc); background:#FFFBEA}
.wmode > b{transition:opacity .2s}
.wtop.talking .wmode > b{opacity:0}
.wbubble{position:absolute; right:72px; top:0; max-width:calc(100% - 162px); background:#fff; color:var(--ink); border:3px solid #3B3B3B; border-radius:8px; padding:6px 12px;
  font-size:20px; font-weight:700; line-height:1.25; white-space:normal; width:max-content; text-align:center; box-shadow:0 3px 0 rgba(0,0,0,.18); opacity:0; transform:translateY(6px); transition:opacity .2s, transform .2s; pointer-events:none; z-index:3}
.wbubble.show{opacity:1; transform:none}
.wbubble::after{content:''; position:absolute; right:-12px; top:12px; border-style:solid; border-width:8px 0 8px 10px; border-color:transparent transparent transparent #3B3B3B}
.avatar.nod svg{animation:hop .35s ease-in-out 1}
.wburst{position:fixed; width:0; height:0; pointer-events:none; z-index:45}
.wburst i{position:absolute; left:0; top:0; border:2px solid rgba(0,0,0,.25); box-sizing:border-box; animation:wb 1.1s cubic-bezier(.2,.7,.4,1) both}
@keyframes wb{0%{transform:translate(0,0) scale(.5); opacity:1}60%{transform:translate(var(--bx), var(--by)) scale(1); opacity:1}100%{transform:translate(var(--bx), calc(var(--by) + 60px)); opacity:0}}
.linkbtn{background:none; border:0; padding:8px 6px; font-size:16px; color:var(--ink-soft); text-decoration:underline; min-height:40px; letter-spacing:.04em}
.fbgem{display:inline-block; width:30px; height:30px; vertical-align:-6px; margin:0 4px 0 6px; line-height:0}
.fbgem svg{width:100%; height:100%}
/* ---------- Weeks + Block Mine levels ---------- */
.weekchip{display:inline-flex; align-items:center; gap:6px; margin:2px 0 0; padding:3px 12px 3px 8px; background:#FFF; border:2px solid var(--line); border-radius:999px; font-size:18px; font-weight:700; color:var(--ink-soft); letter-spacing:.04em; line-height:1.3}
.weekchip .emoji{font-size:18px}
.lvlbadge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 5px; border-radius:10px; background:#fff; border:3px solid #BFAF8A; box-shadow:0 3px 0 #BFAF8A; font-weight:700; font-size:18px; letter-spacing:.04em; min-height:44px}
.lvlbadge .px, .lvlname .px, .lvlsum .px{width:28px; height:28px; flex:0 0 auto; outline:2px solid rgba(0,0,0,.25); outline-offset:-2px}
.lvlbar{display:flex; align-items:center; gap:8px; margin:0 0 6px; padding:5px 8px; background:#fff; border:2px solid var(--line); border-radius:10px; font-size:16px; letter-spacing:.03em}
.lvlname{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.xpmeter{flex:1; height:14px; min-width:60px; background:#E9E2D0; border:2px solid #BFB39A; border-radius:4px; overflow:hidden}
.xpmeter i{display:block; height:100%; background:linear-gradient(#8EE06A, #5DA83A); transition:width .6s ease}
.xpnum{font-weight:700; white-space:nowrap; min-width:3.2em; text-align:right}
.quarry.lv-wood{background:linear-gradient(transparent calc(100% - 18px), #6B4222 calc(100% - 18px)), linear-gradient(#E4F4DA, #F5EEDC)}
.quarry.lv-stone{background:linear-gradient(transparent calc(100% - 18px), #5A5A5A calc(100% - 18px)), linear-gradient(#E6F2FA, #E4E4E0)}
.quarry.lv-iron{background:linear-gradient(transparent calc(100% - 18px), #5E4A3C calc(100% - 18px)), linear-gradient(#F2E8DD, #DCCBBB)}
.quarry.lv-gold{background:linear-gradient(transparent calc(100% - 18px), #A8823A calc(100% - 18px)), linear-gradient(#FFF6D6, #F3DE9C)}
.quarry.lv-diamond{background:linear-gradient(transparent calc(100% - 18px), #34425A calc(100% - 18px)), linear-gradient(#D8F3FA, #A9D9E8)}
.quarry.lv-crystal{background:linear-gradient(transparent calc(100% - 18px), #4F3E66 calc(100% - 18px)), linear-gradient(#F3EAFB, #D9C6EF)}
.quarry.lv-star{background:linear-gradient(transparent calc(100% - 18px), #1E2440 calc(100% - 18px)), radial-gradient(circle at 12% 20%, #FFF7C2 0 2px, transparent 3px), radial-gradient(circle at 78% 14%, #FFF7C2 0 2px, transparent 3px), radial-gradient(circle at 46% 30%, #fff 0 1.5px, transparent 2.5px), radial-gradient(circle at 90% 46%, #fff 0 1.5px, transparent 2.5px), linear-gradient(#2A3160, #46508A)}
.quarry.lv-rainbow{background:linear-gradient(transparent calc(100% - 18px), #8A5A7A calc(100% - 18px)), linear-gradient(#FFE3E3, #FFF3D6 30%, #E3F8E3 55%, #DDEBFF 80%, #EFE0FF)}
.lvlpop{position:fixed; inset:0; z-index:62; background:rgba(40,30,20,.5); display:flex; align-items:center; justify-content:center; padding:16px}
.lvlcard{position:relative; overflow:hidden; background:var(--card); border:4px solid #C98A00; border-radius:14px; box-shadow:0 8px 0 #A87A0A; padding:16px; max-width:420px; width:100%; text-align:center; animation:lvin .7s ease-out both}
.lvlcard > *{position:relative}
.lvlcard h2{font-size:38px; margin:0; text-shadow:2px 2px 0 #FFE7A0}
.lvlrow{display:flex; align-items:center; justify-content:center; gap:14px; margin:4px 0}
.lvlrow .avatar{width:96px}
.lvlbig .px{width:96px; height:96px; outline:4px solid rgba(0,0,0,.28); outline-offset:-4px; animation:lvbob 3s ease-in-out infinite}
.lvltitle{font-size:30px; margin:4px 0}
.lvlnew{font-size:20px; margin:6px 0}
.lvlitem{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.lvlitem .px.mini{width:34px; height:34px}
.lvlglow{position:absolute !important; left:50%; top:42%; width:520px; height:520px; margin:-260px 0 0 -260px; pointer-events:none; background:repeating-conic-gradient(rgba(255,210,63,.20) 0 10deg, transparent 10deg 30deg); border-radius:50%; animation:lvspin 16s linear infinite}
.lvlsparks{position:absolute !important; inset:0; pointer-events:none}
.lvlsparks i{position:absolute; width:10px; height:10px; background:#FFD23F; transform:rotate(45deg); opacity:0; animation:lvtw 2.4s ease-in-out infinite}
.lvlpop.still .lvlcard, .lvlpop.still .lvlglow, .lvlpop.still .lvlbig .px{animation:none}
@keyframes lvin{0%{transform:translateY(24px) scale(.92); opacity:0}100%{transform:none; opacity:1}}
@keyframes lvspin{to{transform:rotate(360deg)}}
@keyframes lvbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lvtw{0%,100%{opacity:0; transform:rotate(45deg) scale(.4)}50%{opacity:.9; transform:rotate(45deg) scale(1)}}
.lvlcard.lv-stone{border-color:#6E6E6E; box-shadow:0 8px 0 #4E4E4E}
.lvlcard.lv-iron{border-color:#8A6A4F; box-shadow:0 8px 0 #5E4A3C}
.lvlcard.lv-diamond{border-color:#1F9AAE; box-shadow:0 8px 0 #146B7A}
.lvlcard.lv-crystal{border-color:#6B3FA0; box-shadow:0 8px 0 #4A2B70}
.lvlcard.lv-star{border-color:#3B466E; box-shadow:0 8px 0 #262F4F}
.lvlcard.lv-rainbow{border-color:#C2185B; box-shadow:0 8px 0 #8A1040}
.m-review{background:#E3DCF5}
.review-off{grid-column:1 / -1; font-size:17px; color:var(--ink-soft); background:#fff; border:2px dashed var(--line); border-radius:10px; padding:10px 14px; text-align:left; line-height:1.45}
.mode small{font-size:18px; font-weight:700; opacity:.85}
.hint.center{text-align:center; font-size:17px; color:var(--ink-soft)}
.lvlsum{display:flex; align-items:center; gap:12px; background:#fff; border:2px solid var(--line); border-radius:12px; padding:8px 12px; margin:8px 0; line-height:1.5}

.qchip{display:inline-block; background:#F7EED8; border-radius:8px; padding:0 8px; margin:2px 2px 2px 0; white-space:nowrap; font-size:16px}
.qchip small{color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.topr{color:#8A5A00}
.curtag{display:inline-block; font-style:normal; font-size:14px; font-weight:700; background:#DDF0D0; color:#2F5E1F; border-radius:999px; padding:0 8px; letter-spacing:.03em; vertical-align:2px}
.wklist{display:grid; gap:8px; margin:6px 0 4px}
.wkbtn{position:relative; display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:0; padding:8px 12px; min-height:60px; border-radius:12px; border:3px solid var(--line); background:#fff; font-size:19px; box-shadow:0 3px 0 var(--line); letter-spacing:.04em}

.btn.danger{border-color:#D69A1E}

/* ---------- v2: adventure, world map, mastery ---------- */
.adv-hero{display:flex; align-items:center; gap:16px; width:100%; margin:4px 0 12px; padding:10px 16px 10px 10px; min-height:112px; border-radius:10px; border:4px solid #1D5A21; background:linear-gradient(#6DBB45 0 14px, #4E9632 14px 18px, #F7E3B8 18px); box-shadow:inset 0 -6px 0 rgba(0,0,0,.08), 0 6px 0 #1D5A21; color:var(--ink); text-align:left}

.adv-hero .heroart{width:112px; height:78px; flex:0 0 auto; border:3px solid rgba(0,0,0,.3); border-radius:6px; margin-top:10px}

.map{margin:4px 0 10px}
.mrow{display:flex; align-items:center; gap:0}

.hstep{flex:0 0 26px; display:flex; flex-direction:column; align-items:center; gap:6px}
.hstep i, .vstep i{width:14px; height:14px; background:#B9A57E; border:2px solid #8F7B55; display:block}
.vstep{display:flex; gap:8px; height:30px; align-items:center; padding:0 8%}
.vstep.at-r{justify-content:flex-end}.vstep.at-l{justify-content:flex-start}

.biome{position:relative; flex:1 1 0; min-width:0; padding:6px 6px 8px; border-radius:10px; border:4px solid rgba(0,0,0,.28); background:#fff; box-shadow:0 6px 0 rgba(0,0,0,.2); display:flex; flex-direction:column; align-items:center; gap:2px}

.biome .biomeart{width:100%; height:auto; aspect-ratio:20/14; border-radius:4px}
.biome.locked{background:#F4EEDD}
.biome.locked .biomeart{filter:grayscale(.55) brightness(.95); opacity:.75}
.lockbig{position:absolute; left:50%; top:50%; transform:translate(-50%, -50%)}
.lockbig .px{width:40px; height:40px}
.biome.here{border-color:#F2A900; box-shadow:0 0 0 4px #FFE27A, 0 6px 0 rgba(0,0,0,.2)}
.biome.fresh{animation:pop 1s ease 2}
.bname{font-size:19px; font-weight:700; line-height:1.2; letter-spacing:.06em; text-align:center}
.bstars, .blocked{display:inline-flex; align-items:center; gap:6px; font-size:16px; letter-spacing:.04em}
.bstars .pxstar{width:22px; height:22px}
.mapav{position:absolute; width:17%; right:10%; bottom:20%; filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.shelfh{font-size:26px; margin:16px 0 6px}
.collection{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px}

.citem .collect{width:52px; height:52px}
.citem.none{background:#F4EEDD; color:#9A8F76}
.citem .q{font-size:34px; font-weight:700; height:52px; line-height:52px}
.hint.center{text-align:center}
.advpath{display:flex; gap:4px; align-items:flex-end; justify-content:center; margin:0 0 12px; padding:6px 6px 0; border-radius:8px; background:linear-gradient(transparent 0 70%, #6DBB45 70% 80%, #9A6534 80%)}
.advpath.b-desert, .advpath.b-reef{background:linear-gradient(transparent 0 70%, #F2D38A 70% 80%, #D9B060 80%)}
.advpath.b-snow, .advpath.b-sky{background:linear-gradient(transparent 0 70%, #FFFFFF 70% 80%, #8C96A3 80%)}

  WST.local = WST.local.filter(function(x){ return x.id !== id; });
  var b = builtinById(id);
  if (b){ WST.hidden = WST.hidden.filter(function(x){ return x !== id; }); if (weekCore(w) !== weekCore(b)) WST.local.push(w); }
  else WST.local.push(w);
}
function commitWeek(L, id){ putWeek(L, id); var ok = saveWeeks(); refreshWeeks(); return ok; }
function restoreBuiltin(id){ WST.local = WST.local.filter(function(x){ return x.id !== id; }); WST.hidden = WST.hidden.filter(function(x){ return x !== id; }); var ok = saveWeeks(); refreshWeeks(); return ok; }
function deleteWeek(id){
  if (builtinById(id)){ if (WST.hidden.indexOf(id) < 0) WST.hidden.push(id); }
  WST.local = WST.local.filter(function(x){ return x.id !== id; });
  if (WST.current === id) WST.current = 'auto';
  var ok = saveWeeks(); refreshWeeks(); return ok;
}
function unhideBuiltins(){ WST.hidden = []; var ok = saveWeeks(); refreshWeeks(); return ok; }
function setCurrentWeek(id){ WST.current = id || 'auto'; var ok = saveWeeks(); refreshWeeks(); return ok; }
function nextWeekDate(){
  var last = ''; WEEKS.forEach(function(w){ if (w.date && w.date > last) last = w.date; });
  if (!last) return todayStr();
  var d = new Date(last + 'T12:00:00'); d.setDate(d.getDate() + 7);
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
/* Export code: every week + which one is "this week" */
function exportCode(){
  return JSON.stringify({app:'luke-study', v:2, current:WST.current, weeks:WEEKS.map(function(w){
    var o = {id:w.id, label:w.label}; if (w.date) o.date = w.date; o.pattern = w.pattern;
    o.words = w.words.map(function(x){ var r = {w:x.w}; if (x.s) r.s = x.s; if (x.pic) r.pic = x.pic; return r; }); o.math = w.math; return o; })});
}
function parseCode(text){
  text = String(text || '').trim();
  if (!text) return null;
  var a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a >= 0 && b > a) text = text.slice(a, b + 1);
  try { return JSON.parse(text); } catch(e){}
  try { return JSON.parse(text.replace(/[“”„]/g, '"').replace(/[‘’]/g, "'")); } catch(e){}
  return null;
}
/* Import: a code with weeks is merged by week id (weeks not in the code are kept); an old one-list code replaces the week being edited */
function importCode(raw, intoId){
  if (Array.isArray(raw.weeks)){
    if (!raw.weeks.length) return {errors:[{msg:'That code has no weeks in it.'}]};
    var errs = [], good = [];
    raw.weeks.slice(0, 60).forEach(function(w, k){
      var r = cleanList(w);
      if (r.errors.length) r.errors.forEach(function(e){ errs.push({msg:(r.list ? r.list.label : 'Week ' + (k+1)) + ': ' + e.msg}); });
      else { r.list.id = cleanId(w.id) || newWeekId(); good.push(r.list); }
    });
    if (errs.length) return {errors:errs};
    good.forEach(function(L){ putWeek(L, L.id); });
    if (typeof raw.current === 'string' && (raw.current === 'auto' || good.some(function(L){ return L.id === raw.current; }))) WST.current = raw.current;
    var ok = saveWeeks(); refreshWeeks();
    return {ok:ok, count:good.length, errors:[], id: good.length === 1 ? good[0].id : null};
  }
  var r1 = cleanList(raw);
  if (r1.errors.length) return {errors:r1.errors};
  var target = weekById(intoId) || LIST;
  if (!raw.date) r1.list.date = target.date;
  var ok1 = commitWeek(r1.list, target.id);
  return {ok:ok1, count:1, errors:[], id:target.id};
}

/* ---------------- Read-aloud (Web Speech API) ---------------- */
var Speech = (function(){
  var synth = window.speechSynthesis;
  var ok = !!(synth && window.SpeechSynthesisUtterance);
  var RATE = 0.8, voice = null, unlocked = false, keep = [], token = 0;
  var PREFERRED = ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Ava', 'Ava', 'Allison', 'Susan', 'Nicky', 'Microsoft Zira'];
  var NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Fred|Kathy|Grandpa|Grandma|Rocko|Shelley|Eddy|Flo|Reed|Sandy/i;
  function pickVoice(){
    if (!ok) return;
    var vs = []; try { vs = synth.getVoices() || []; } catch(e){}
    if (!vs.length) return;
    var us = vs.filter(function(v){ return /^en[-_]US/i.test(v.lang); });
    var best = null;
    for (var i=0; i<PREFERRED.length && !best; i++){
      for (var j=0; j<us.length; j++){ if (us[j].name.indexOf(PREFERRED[i]) === 0) { best = us[j]; break; } }
    }
    if (!best) best = us.filter(function(v){ return !NOVELTY.test(v.name); })[0] || vs.filter(function(v){ return /^en/i.test(v.lang) && !NOVELTY.test(v.name); })[0] || null;
    voice = best;
  }
  if (ok){
    pickVoice();
    if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice); else synth.onvoiceschanged = pickVoice;
  }
  /* iOS only allows speech that starts from a tap. Speak a silent utterance on the first tap to unlock it. */
  function unlock(){
    if (!ok || unlocked) return; unlocked = true;
    try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'en-US'; synth.speak(u); } catch(e){}
  }
  function stop(){ token++; if (!ok) return; try { if (synth.speaking || synth.pending) synth.cancel(); } catch(e){} }
  function one(text, rate, onend){
    if (!ok){ if (onend) setTimeout(onend, 400); return; }
    var u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.lang = 'en-US'; u.rate = rate || RATE; u.pitch = 1.05; u.volume = 1;
    var done = false, t;
    function fin(){ if (done) return; done = true; clearTimeout(t); var i = keep.indexOf(u); if (i >= 0) keep.splice(i, 1); if (onend) onend(); }
    u.onend = fin; u.onerror = fin;
    t = setTimeout(fin, 2500 + text.length * 120 / (rate || RATE)); /* safety net if onend never fires (Safari) */
    keep.push(u); /* keep a reference so Chrome doesn't garbage-collect it mid-speech */
    try { if (synth.paused) synth.resume(); synth.speak(u); } catch(e){ fin(); }
  }
  function say(text, rate, onend){ stop(); var my = token; one(text, rate, function(){ if (my === token && onend) onend(); }); }
  /* steps: [{text, rate, before: fn, gap: ms}] */
  function seq(steps, done){
    stop(); var my = token, i = 0;
    (function next(){
      if (my !== token) return;
      if (i >= steps.length){ if (done) done(); return; }
      var s = steps[i++]; if (s.before) s.before();
      one(s.text, s.rate, function(){ if (my !== token) return; setTimeout(next, s.gap == null ? 250 : s.gap); });
    })();
  }
  function busy(){ try { return ok && !!(synth.speaking || synth.pending); } catch(e){ return false; } }
  return {ok:ok, say:say, seq:seq, stop:stop, unlock:unlock, busy:busy, RATE:RATE};
})();
document.addEventListener('touchend', Speech.unlock, {capture:true, passive:true});
document.addEventListener('click', Speech.unlock, true);

  /* cfg: {title, items:[{type, id}], quiz:bool, key} */

    if (i >= cfg.items.length) return finish();

    if (cfg.quiz){ var qe = {kind:cfg.key, got:got, of:n, practice:missed}; if (cfg.review) qe.review = cfg.review; logQuiz(qe); }
    shell(cfg.title,
      '<div class="card end">' +
        avatarHTML('cheer big') +
        '<h2>You did it, Luke!</h2>' +
        '<p style="font-size:24px;margin:0">You earned <b>'+got+'</b> '+(got===1?'star':'stars')+'!</p>' +
        '<div class="starrow" aria-hidden="true">'+(stars || '<span class="emoji">🌟</span>')+'</div>' +
        (missed.length ? '<p class="practice-list">Let’s practice these again: <b>'+missed.map(function(x){ return '<span style="white-space:nowrap">'+esc(x)+'</span>'; }).join(', ')+'</b></p>' : '<p class="practice-list">Every single one! Wow!</p>') +

  }

}

/* ---------------- 2. Build the Word ---------------- */
function makeTiles(word, extra){
  var letters = word.split(''), d = [];
  if (Math.random() < 0.4){
    var c = letters.map(function(l){ return CONFUSE[l]; }).filter(function(x){ return x && letters.indexOf(x) < 0; });
    if (c.length) d.push(pick(c)); /* at most one b/d, p/q or m/n look-alike */
  }
  var pool = shuffle(POOL.filter(function(x){ return letters.indexOf(x) < 0 && d.indexOf(x) < 0 && !CONFUSE[x]; }));
  if (pool.length < extra) pool = pool.concat(shuffle('aeiou'.split('').filter(function(x){ return letters.indexOf(x) < 0; })));
  while (d.length < extra && pool.length) d.push(pool.shift());
  return shuffle(letters.concat(d));
}
function renderBuild(stage, w, cfg, done){
  var o = wordObj(w), n = w.length, tries = 0, finished = false;
  var tiles = makeTiles(w, cfg.quiz ? 3 : 2);
  var slots = range(n).map(function(){ return null; }); /* each: index into tiles */
  var placed = []; /* filled slots in the order they were filled (for Undo) */
  var boxStyle = '', boxesStyle = '';
  if (n > 3){ /* longer words: fit the boxes to the screen */
    var gap = n > 5 ? 6 : 10, bw = Math.max(44, Math.min(92, Math.floor((viewW() - 40 - (n-1)*gap) / n)));
    boxesStyle = ' style="gap:'+gap+'px"';
    boxStyle = ' style="width:'+bw+'px;height:'+Math.round(bw*1.13)+'px;font-size:'+Math.round(bw*0.65)+'px"';
  }
  stage.innerHTML =
    '<p class="prompt">Listen, then build the word.</p>' +
    '<div class="row" style="margin-top:0">' +

var FONT_STACK = 'Andika, Verdana, "Comic Sans MS", Arial, sans-serif';

/* ---------------- Word strength (used by Review and the grown-ups' summary) ---------------- */
/* misses: game/quiz items not right on the first try; again: "Practice again" in Write It */
function wordNeeds(w){
  var d = load(), s = d.words[w] || {tries:0, right:0, first:0}, wr = d.write[w] || {tries:0, right:0};

/* Past-week words he missed or marked "Practice again", heaviest (weakest) first */
function reviewPool(){

  WEEKS.forEach(function(wk){
    if (wk.id === LIST.id || (wk.date && LIST.date && wk.date > LIST.date)) return;
    wk.words.forEach(function(o){
      if (cur[o.w] || seen[o.w]) return;
      var n = wordNeeds(o.w); if (!n.misses && !n.again) return;
      seen[o.w] = 1; out.push({w:o.w, wk:wk.id, pat:wk.pattern, wt:Math.round(Math.max(0.5, 1 + n.weak) * 10) / 10});
    });

    var r = Math.random() * sum, k = 0;
    for (; k < left.length - 1; k++){ r -= left[k].wt; if (r < 0) break; }

}

  var past = weightedPick(pool, nR);
  var items = past.map(function(x){ return {type: Math.random() < 0.5 ? 'build' : 'hunt', id:x.w, pat:x.pat}; })
    .concat(shuffle(WORDS).slice(0, nC).map(function(o){ return {type: Math.random() < 0.5 ? 'build' : 'hunt', id:o.w}; }));
  return {items:shuffle(items), past:past.map(function(x){ return x.w; })};
}

function readPicture(file, cb){
  if (!file || !/^image\//.test(file.type || '')) return cb(null);
  var r = new FileReader();
  r.onload = function(){
    var img = new Image();
    img.onload = function(){
      try {
        var S = 160, sc = Math.min(1, S / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.75));
      } catch(e){ cb(null); }
    };
    img.onerror = function(){ cb(null); };
    img.src = r.result;
  };
  r.onerror = function(){ cb(null); };
  r.readAsDataURL(file);
}

/* =====================================================================================
   v2: MASTERY + SPACED REVIEW + ADVENTURE MAP
   Every word and math fact becomes "concepts" (read-bag, spell-bag, math-3+1). Each concept keeps
   a small score in localStorage (inside lukeStudyApp.v1 → mastery). 3 right on the first try in a
   row = mastered; a miss drops it back. Leitner boxes (1..5) decide when it is due again, so missed
   ones come back soon and often, mastered ones now and then. "Play today's adventure" builds a short
   level (about 9 items, ~70% new/shaky + ~30% review from every week so far). Mastering concepts
   unlocks lands on the world map and earns blocks for the Block Mine hotbar.
   ===================================================================================== */
var MASTER_STREAK = 3;                  /* 3 first-try rights in a row = mastered */
var BOX_DAYS = [0, 0, 1, 3, 7, 14];     /* Leitner box -> days until due again (box 1 = today, again soon) */
var SESSION_N = 9, SESSION_MAX = 10, SESSION_MIN = 8, REVIEW_SHARE = 0.3;
var MASTERY_ORE = {read:'gem', spell:'gold', math:'green'};  /* the block each mastered concept earns */

function addDays(s, n){ var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dayDiff(a, b){ return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }
function mathConcept(f){ return 'math-' + f.a + f.op + f.b; }
function conceptFromFactId(id){ id = String(id); return /^\d+$/.test(id) ? 'math-' + id + '+1' : 'math-' + id; }
function conceptParts(c){ var k = c.indexOf('-'); return {type:c.slice(0, k), key:c.slice(k + 1)}; }
function conceptLabel(c){
  var p = conceptParts(c);
  if (p.type === 'math') return p.key.replace(/(\d)([+-])(\d)/, function(m, a, op, b){ return a + ' ' + (op === '+' ? '+' : '−') + ' ' + b; });
  return p.key;
}
var TYPE_NAME = {read:'Reading', spell:'Spelling', math:'Math'};

/* ---------- per-concept scores ---------- */
function masteryStore(){ var d = load(); if (!d.mastery || typeof d.mastery !== 'object' || !d.mastery.c) d.mastery = {v:1, c:{}}; return d.mastery; }
function cstat(c){ return masteryStore().c[c] || null; }
function conceptStatus(c){ var s = cstat(c); if (!s || !s.n) return 'new'; return s.s >= MASTER_STREAK ? 'mastered' : 'learning'; }
var MASTERY_HOOK = null;   /* the adventure listens here for "just mastered!" moments */
/* One try at a concept. success = right on the first try. */
function practiced(c, success, today){
  if (!c) return null;
  today = today || todayStr();
  var st = masteryStore(), s = st.c[c] || (st.c[c] = {n:0, r:0, s:0, b:1, due:today, last:''});
  var was = s.s >= MASTER_STREAK;
  s.n++; s.last = today;
  if (success){ s.r++; s.s++; s.b = Math.min(5, (s.b || 1) + 1); s.due = addDays(today, BOX_DAYS[s.b]); }
  else { s.s = 0; s.b = 1; s.due = today; s.miss = (s.miss || 0) + 1; }
  var now = s.s >= MASTER_STREAK;
  if (now && !s.m) s.m = today;          /* first time mastered: map lands + blocks count this (never taken back) */
  save();
  var res = {concept:c, success:!!success, mastered:now, newlyMastered:now && !was, dropped:was && !now, box:s.b, streak:s.s, due:s.due};
  if (MASTERY_HOOK) { try { MASTERY_HOOK(res); } catch(e){} }
  return res;
}
/* One-time move: turn v1 stats into starting scores. Old stats, stars, weeks and Block Mine are not touched. */
function seedMastery(d){
  var c = {}, t = todayStr();
  function fromStat(st){
    if (!st || !st.tries) return null;
    var good = st.first != null ? st.first : (st.right || 0), miss = Math.max(0, st.tries - good);
    var s = miss === 0 ? Math.min(good, MASTER_STREAK) : (good >= 2 * miss ? 1 : 0);
    return {n:st.tries, r:good, s:s, miss:miss};
  }
  function put(id, o){
    if (!o) return;
    var cur = c[id];
    if (cur){ cur.n += o.n; cur.r += o.r; cur.s = Math.min(cur.s, o.s); cur.miss += o.miss; }
    else c[id] = {n:o.n, r:o.r, s:o.s, miss:o.miss};
  }
  var words = d.words || {}, write = d.write || {}, math = d.math || {}, k;
  for (k in words){ var o = fromStat(words[k]); if (!o) continue; put('read-' + k, o); put('spell-' + k, {n:o.n, r:o.r, s:o.s, miss:o.miss}); }
  for (k in write){ var w = write[k]; if (!w || !w.tries) continue; var wm = Math.max(0, w.tries - (w.right || 0)); put('spell-' + k, {n:w.tries, r:w.right || 0, s: wm ? 0 : Math.min(w.right || 0, MASTER_STREAK), miss:wm}); }
  for (k in math){ var m = fromStat(math[k]); if (m) put(conceptFromFactId(k), m); }
  for (k in c){ var x = c[k]; x.b = Math.min(5, x.s + 1); x.due = t; x.last = ''; if (!x.miss) delete x.miss; if (x.s >= MASTER_STREAK){ x.m = t; x.seeded = 1; } }
  return {v:1, c:c, seeded:t};
}

/* ---------- content rows: generated from the week lists (adding a week = adding rows) ---------- */
function wordDifficulty(w, pat){ var d = w.length <= 3 ? 1 : w.length <= 5 ? 2 : 3; if (pat && pat.length > 1 && d < 3) d++; return d; }
function factDifficulty(f){ var d = (f.b === 1 && f.ans <= 10) ? 1 : (f.b <= 3 && f.ans <= 15) ? 2 : 3; if (f.op === '-' && d < 3) d++; return d; }
function contentRows(weeks){
  var rows = [];
  (weeks || WEEKS).forEach(function(wk){
    wk.words.forEach(function(o){
      var d = wordDifficulty(o.w, wk.pattern);
      rows.push({concept:'read-' + o.w, type:'read', prompt:o.w, answer:o.w, difficulty:d, week:wk.id, pat:wk.pattern});
      rows.push({concept:'spell-' + o.w, type:'spell', prompt:o.w, answer:o.w, difficulty:Math.min(3, d + (o.w.length > 3 ? 1 : 0)), week:wk.id, pat:wk.pattern});
    });
    buildFacts(wk.math).forEach(function(f){ rows.push({concept:mathConcept(f), type:'math', prompt:factText(f), answer:f.ans, difficulty:factDifficulty(f), week:wk.id, fact:f.id}); });
  });
  return rows;
}
var ROW_ACTIVITY = {read:'hunt', spell:'build', math:'math'};
/* Rows the adventure may use: this week + every earlier week (later weeks wait). One row per concept. */
function sessionRows(){
  var out = [], at = {};
  contentRows().forEach(function(r){
    var wk = weekById(r.week);
    if (r.week !== LIST.id && wk && wk.date && LIST.date && wk.date > LIST.date) return;
    var k = at[r.concept];
    if (k == null){ at[r.concept] = out.length; out.push(r); }
    else if (r.week === LIST.id) out[k] = r;      /* this week's copy wins (its blue letters) */
  });
  return out;
}

/* ---------- the scheduler ---------- */
function pickBalanced(pool, n, rnd){
  var left = pool.slice(), out = [], cnt = {read:0, spell:0, math:0}, used = {};
  var cap = {math:Math.ceil(n * 0.45), read:Math.ceil(n * 0.6), spell:Math.ceil(n * 0.6)};
  function wt(x){ return x.wt * (x.row.type !== 'math' && used[x.row.prompt] ? 0.2 : 1); }
  while (out.length < n && left.length){
    var ok = left.filter(function(x){ return cnt[x.row.type] < cap[x.row.type]; });
    if (!ok.length) ok = left;
    var sum = 0; ok.forEach(function(x){ sum += wt(x); });
    var r = rnd() * sum, k = 0;
    for (; k < ok.length - 1; k++){ r -= wt(ok[k]); if (r < 0) break; }
    var p = ok[k]; out.push(p); left.splice(left.indexOf(p), 1); cnt[p.row.type]++;
    if (p.row.type !== 'math') used[p.row.prompt] = 1;
  }
  return out;
}
function orderSession(picks){
  var a = shuffle(picks), out = [];
  if (!a.length) return a;
  function ease(x){ return (x.bucket === 'review' ? 0 : 10) + x.row.difficulty; }
  /* start with an easy win, end on a confident one */

  var B = BIOMES[bi], h = '<div class="advpath b-' + B.id + '" id="advPath" data-steps="' + n + '" data-at="' + i + '" style="background:linear-gradient(' + B.sky[1] + ' 0 70%, ' + B.top[0] + ' 70% 80%, ' + B.soil[0] + ' 80%)" aria-label="Step ' + (Math.min(i, n - 1) + 1) + ' of ' + n + '">';
  for (var k=0;k<n;k++) h += '<span class="st' + (k < i ? ' done' : k === i ? ' now' : '') + (k === n - 1 ? ' goal' : '') + '">' +
    (k === i ? avatarHTML('pathav') : k < i ? pixSVG(GEM_ROWS, {G:'#A87A0A', g:'#F5C542', w:'#FFF0A8'}, 'pgem') : k === n - 1 ? CHEST_SVG : '<i class="stone"></i>') + '</span>';
  return h + '</div>';
}
var ADV = null;   /* the level being played */
function adventure(){
  var bi = currentBiomeIdx(), plan = planSession(), items = plan.items, i = 0, results = [], masteredNow = [], reasked = {};
  ADV = {items:items, plan:plan.counts, biome:BIOMES[bi].id, results:results};
  if (!items.length){ shell('Adventure', '<p class="prompt">Ask a grown-up to add some words first.</p>'); return; }
  MASTERY_HOOK = function(r){ if (r.newlyMastered && masteredNow.indexOf(r.concept) < 0){ masteredNow.push(r.concept); masteryToast(r.concept); } };
  var cfg = {title:'Adventure', quiz:false, key:'adventure'};
  function show(){
    if (i >= items.length) return finish();
    var it = items[i];
    PAT_OVERRIDE = it.pat != null ? it.pat : null;
    shell(esc(BIOMES[bi].name), pathHTML(i, items.length, bi) +
      (it.bucket === 'again' ? '<p class="againtag">One more go with this one. You can do it!</p>' : '') +
      '<div id="stage" class="advstage" data-concept="' + esc(it.concept) + '" data-bucket="' + it.bucket + '" data-items="' + esc(items.map(function(x){ return x.id; }).join(',')) + '"' + (it.pat != null ? ' data-review="1"' : '') + '></div><div class="row" id="nextRow"></div>');
    var stage = $('#stage'), render = it.type === 'build' ? renderBuild : it.type === 'hunt' ? renderHunt : renderMath;
    render(stage, it.id, cfg, function(res){
      var first = !!(res.correct && res.first);
      results.push({concept:it.concept, first:first, bucket:it.bucket});
      /* missed: it comes back a little later in this level (gently), and sooner in the next ones */
      if (!first && !reasked[it.concept] && items.length < SESSION_MAX){ reasked[it.concept] = 1; items.splice(Math.min(items.length, i + 3), 0, {type:it.type, id:it.id, concept:it.concept, bucket:'again', pat:it.pat, week:it.week}); }
      var last = i + 1 >= items.length, nr = $('#nextRow');
      nr.innerHTML = '<button class="btn go huge" data-act="next">' + (last ? CHEST_SVG + ' Open the chest!' : 'Next <span aria-hidden="true">' + SVG_RIGHT.replace('<svg', '<svg width="30" height="30"') + '</span>') + '</button>';
      $('[data-act=next]', nr).onclick = function(){ i++; show(); };
      later(function(){ var b = $('[data-act=next]'); if (b && b.scrollIntoView) b.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 300);
    });
  }
  function finish(){
    PAT_OVERRIDE = null; MASTERY_HOOK = null;
    var a = advData(), today = todayStr(), b = BIOMES[bi];
    var main = results.filter(function(r){ return r.bucket !== 'again'; }), right = main.filter(function(r){ return r.first; }).length;
    var ratio = main.length ? right / main.length : 1, stars = ratio >= 0.85 ? 3 : ratio >= 0.55 ? 2 : 1;
    var u0 = a.seen;
    a.levels++; a.bl[b.id] = (a.bl[b.id] || 0) + 1; a.st[b.id] = (a.st[b.id] || 0) + stars;
    var sn = bumpStreak(a, today), gift = giveCollectible(bi); save();
    var blocks = deliverMasteryBlocks(), u = unlockedCount(), nb = nextBiome();
    var newLand = u > u0; if (newLand){ a.seen = u; save(); }
    ADV.done = {stars:stars, gift:gift.id, mastered:masteredNow.slice(), blocks:blocks.got.length, newLand:newLand ? BIOMES[u - 1].id : null, streak:sn};
    var big = ''; for (var k=0;k<3;k++) big += '<span class="bstar' + (k < stars ? ' on' : '') + '" style="animation-delay:' + (0.25 + k * 0.35).toFixed(2) + 's">' + STAR_SVG + '</span>';
    var conf = '<div class="confetti" aria-hidden="true">';
    for (var c=0;c<50;c++) conf += '<i style="left:' + Math.round(Math.random() * 100) + '%;top:' + Math.round(8 + Math.random() * 60) + '%;background:' + pick(['#F5C542', '#5EE0F0', '#4CD27A', '#E0473E', '#9A6534', '#6DBB45', '#B48CF0']) + ';animation-delay:' + (Math.random() * 1.2).toFixed(2) + 's"></i>';
    conf += '</div>';
    var gc = collById(gift.id);
    shell(esc(b.name), pathHTML(items.length, items.length, bi) +
      '<div class="card end advend" id="advEnd" data-stars="' + stars + '">' +
        '<div class="endrow">' + avatarHTML('cheer big') + '<div class="giftbox">' + collectSVG(gift.id, 'bigc') + '</div></div>' +
        '<h2>Level complete!</h2>' +
        '<div class="bigstars" aria-label="' + stars + ' of 3 stars">' + big + '</div>' +
        '<p class="giftline" id="giftLine">' + (gift.fresh ? 'You found a new friend for your collection: <b>' + esc(gc.name) + '</b>!' : 'You found another <b>' + esc(gc.name) + '</b>!') + '</p>' +
        (masteredNow.length ? '<p class="mastline" id="mastLine">You mastered: ' + masteredNow.map(function(x){ return '<span class="mchip">' + esc(conceptLabel(x)) + '</span>'; }).join(' ') + '</p>' : '') +
        (blocks.got.length ? '<p class="blockline" id="blockLine"><span class="bl-icons">' + blocks.got.map(function(g){ return dropSVG(g.ore); }).join('') + '</span>+' + blocks.got.length + ' ' + (blocks.got.length === 1 ? 'block' : 'blocks') + ' for Block Mine!</p>'
          : (blocks.pending ? '<p class="blockline" id="blockLine">Your Block Mine hotbar is full. Go craft something!</p>' : '')) +
        (newLand ? '<p class="newland" id="newLand">' + biomeSVG(u - 1, 'mini') + '<b>New land unlocked: ' + esc(BIOMES[u - 1].name) + '!</b></p>' : '') +
        '<p class="streakline" id="streakLine">' + itemSVG('torch', 'mini') + (sn > 1 ? '<b>' + sn + ' days</b> of adventures in a row!' : 'Adventure day <b>1</b>! Come back tomorrow for day 2.') + '</p>' +
        (nb && !newLand ? '<p class="mapnext">Master <b>' + nb.left + '</b> more to open <b>' + esc(nb.b.name) + '</b>.</p>' : '') +
      '</div>' +
      '<div class="row"><button class="btn go huge" data-act="again">Play another level</button><button class="btn alt huge" data-act="map">World map</button></div>' +
      '<div class="row"><button class="btn alt" data-act="home2">' + ICON_HOME + ' Home</button></div>' + conf);
    $('[data-act=again]').onclick = function(){ adventure(); };
    $('[data-act=map]').onclick = function(){ go('map'); };
    $('[data-act=home2]').onclick = function(){ go('home'); };
    Sfx.craft();
    var say = [{text:'Level complete! You earned ' + stars + (stars === 1 ? ' star' : ' stars') + '!', gap:300}, {text:(gift.fresh ? 'You found a ' : 'You found another ') + gc.name + '!', gap:300}];
    if (masteredNow.length) say.push({text:'You mastered ' + masteredNow.length + (masteredNow.length === 1 ? ' thing' : ' things') + '!', gap:300});
    if (newLand) say.push({text:'New land unlocked! ' + BIOMES[u - 1].name + '!', gap:300});
    say.push({text:'Great work, Luke!'});
    Speech.seq(say);
  }
  show();
}

/* ---------- grown-ups: mastery view ---------- */
var STATUS_NAME = {mastered:'Mastered', learning:'Learning', 'new':'Not started'};
function tipFor(c){
  var p = conceptParts(c), w = p.key;
  if (p.type === 'read') return 'Read “' + w + '” together: point under each letter, say the sounds, then slide them into the word.';
  if (p.type === 'spell') return 'Spell “' + w + '” out loud (' + w.split('').join('-') + '), then build it with letter tiles or write it on paper.';
  var m = /^(\d+)([+-])(\d+)$/.exec(w); if (!m) return 'Practice ' + conceptLabel(c) + ' with objects.';
  var a = +m[1], b = +m[3];
  if (m[2] === '+') return b === 1 ? '“Plus 1 is the next number.” Say ' + a + ', then the next number.' : 'Start at ' + a + ' and count on ' + b + ' with fingers or toys.';
  return b === 1 ? '“Minus 1 is the number before.” Count back one from ' + a + '.' : 'Start at ' + a + ' and count back ' + b + ' with fingers or toys.';
}
function practiceTogether(concepts, n){
  return concepts.filter(function(c){ return conceptStatus(c) === 'learning'; })
    .map(function(c){ var s = cstat(c); return {c:c, score:(s.miss || 0) * 2 + (s.b <= 1 ? 3 : 0) - s.s}; })
    .sort(function(x, y){ return y.score - x.score; }).slice(0, n || 5).map(function(x){ return x.c; });
}
function chipHTML(c){
  var s = cstat(c), status = conceptStatus(c), dots = '';
  if (status === 'learning'){ for (var k=0;k<MASTER_STREAK;k++) dots += k < s.s ? '●' : '○'; }
  var title = STATUS_NAME[status] + (s && s.n ? ' · ' + s.r + ' of ' + s.n + ' first-try right · review ' + fmtDate(s.due) : '');
  return '<span class="mc mc-' + status + '" data-c="' + esc(c) + '" data-status="' + status + '" title="' + esc(title) + '">' + esc(conceptLabel(c)) + (status === 'mastered' ? ' ✓' : dots ? ' <small>' + dots + '</small>' : '') + '</span>';
}
function masteryCounts(cs){ var o = {mastered:0, learning:0, 'new':0}; cs.forEach(function(c){ o[conceptStatus(c)]++; }); return o; }
function masteryViewHTML(){
  var rows = contentRows(), all = [], seen = {}, today = todayStr(), st = masteryStore().c;
  rows.forEach(function(r){ if (!seen[r.concept]){ seen[r.concept] = 1; all.push(r.concept); } });
  var tot = masteryCounts(all), pt = practiceTogether(all, 6);
  var due = all.filter(function(c){ var s = st[c]; return s && s.n && s.due <= today; });
  var a = advData(), u = unlockedCount();
  var h = '<div class="mview" id="masteryView">' +
    '<div class="mtotals" id="mTotals" data-mastered="' + tot.mastered + '" data-learning="' + tot.learning + '" data-new="' + tot['new'] + '">' +
      '<div class="mt mt-mastered"><b>' + tot.mastered + '</b>Mastered</div><div class="mt mt-learning"><b>' + tot.learning + '</b>Learning</div><div class="mt mt-new"><b>' + tot['new'] + '</b>Not started</div></div>' +
    '<p class="hint">A skill is <b>mastered</b> after 3 right on the first try in a row (in any game). A miss moves it back to <b>learning</b> and it comes back sooner. ● = right in a row so far.</p>' +
    '<h3>What to practice together</h3>' +
    (pt.length ? '<ul class="ptlist" id="practiceTogether">' + pt.map(function(c){ return '<li data-c="' + esc(c) + '"><b>' + TYPE_NAME[conceptParts(c).type] + ' ' + esc(conceptLabel(c)) + '</b>: ' + esc(tipFor(c)) + '</li>'; }).join('') + '</ul>'
               : '<p class="muted" id="practiceTogether">Nothing shaky right now. Keep playing the daily adventure!</p>') +
    '<p>Due for review today: <b>' + due.length + '</b>. Adventures played: <b>' + a.levels + '</b> · Lands open: <b>' + u + ' of ' + BIOMES.length + '</b> · Day streak: <b>' + streakNow() + '</b> · Blocks earned by mastery: <b>' + a.blocks + '</b>.</p>';
  WEEKS.slice().reverse().forEach(function(wk){
    var wr = rows.filter(function(r){ return r.week === wk.id; }), cs = wr.map(function(r){ return r.concept; }), cnt = masteryCounts(cs), wpt = practiceTogether(cs, 3);
    var grp = function(type){ var list = wr.filter(function(r){ return r.type === type; }); if (type === 'math') list.sort(function(x, y){ var fx = factById(x.fact), fy = factById(y.fact); return fx && fy ? (fx.a - fy.a || fx.b - fy.b) : 0; }); if (!list.length) return ''; return '<div class="mgrp"><span class="mgl">' + TYPE_NAME[type] + '</span>' + list.map(function(r){ return chipHTML(r.concept); }).join('') + '</div>'; };
    h += '<div class="mwk' + (wk.id === LIST.id ? ' cur' : '') + '" data-week="' + esc(wk.id) + '">' +
      '<h4>' + esc(wk.label) + (wk.id === LIST.id ? ' <span class="curtag">This week</span>' : '') + '</h4>' +
      '<p class="mwkcount"><span class="mc mc-mastered">' + cnt.mastered + ' mastered</span> <span class="mc mc-learning">' + cnt.learning + ' learning</span> <span class="mc mc-new">' + cnt['new'] + ' not started</span></p>' +
      grp('read') + grp('spell') + grp('math') +
      (wpt.length ? '<p class="mwkpt"><b>Practice together:</b> ' + wpt.map(function(c){ return esc(TYPE_NAME[conceptParts(c).type].toLowerCase() + ' ' + conceptLabel(c)); }).join(', ') + '</p>' : '') +
    '</div>';
  });
  h += '<p class="hint">How the daily adventure picks: about 7 in 10 items are new or shaky (missed ones first), about 3 in 10 are review from every week so far (skills due for review come first; mastered ones now and then). Review gaps grow: tomorrow, then 3 days, a week, 2 weeks.</p></div>';
  return h;
}
function masteryPage(){
  shell('Mastery', '<div class="grown">' + '<div class="row" style="justify-content:flex-start;margin-top:4px"><button class="btn alt" data-act="back">For grown-ups</button></div>' + '<h2>Mastery by week</h2>' + masteryViewHTML() + '</div>');
  $('[data-act=back]').onclick = function(){ go('grownups'); };
}
/* hooks for the headless tests */
window.LukeV2 = {rows:function(){ return contentRows(); }, plan:planSession, practiced:practiced, status:conceptStatus, stat:cstat, store:masteryStore,
  seed:seedMastery, unlocked:unlockedCount, mastered:everMastered, biomes:BIOMES, adv:advData, streakAfter:function(last, n, today){ var a = {streak:{n:n, last:last}, days:[]}; return bumpStreak(a, today); },
  addDays:addDays, today:todayStr, save:save, reload:function(){ mem = null; return load(); }};

/* ---------------- Router ---------------- */
var routes = {home:home, learn:learn, build:build, hunt:hunt, math:math, quiz:quiz, grownups:grownups, edit:edit, game:game, crafts:crafts, write:write, map:mapScreen, adventure:adventure, mastery:masteryPage};
function route(){
  clearTimers(); Speech.stop(); MASTERY_HOOK = null;
  var h = (location.hash || '#home').replace('#','').split(/[?&]/)[0];
  var fn = routes[h] || home;
  if (fn !== edit){ draft = null; dirty = false; }             /* leaving the editor drops unsaved changes */
  if (fn !== edit && fn !== grownups) editUnlocked = false;   /* ask again after Luke's screens */
  PAT_OVERRIDE = null;
  if (fn === learn){ learnIdx = 0; }
  if (fn === write){ writeIdx = 0; writePass = 'trace'; }
  fn();
  if (fn === learn) later(function(){ speakWord(WORDS[learnIdx].w); }, 350);
}
window.addEventListener('hashchange', route);
fixEmoji();
loadWeeks();
route();
})();
</script>
