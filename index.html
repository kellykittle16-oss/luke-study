  --radius:20px;
  --font:"Andika", Verdana, "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:20px; line-height:1.6;
  letter-spacing:.12em; word-spacing:.16em;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh; min-height:100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font-family:inherit; letter-spacing:inherit; color:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; cursor:pointer}
button:focus-visible{outline:4px solid #F2A900; outline-offset:3px}
.emoji{font-family:var(--emoji); letter-spacing:0; line-height:1; font-style:normal}
.wrap{max-width:760px; margin:0 auto; padding:12px 16px 40px}

/* Top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0 10px}
.home-btn{display:flex; align-items:center; gap:8px; background:#fff; border:3px solid var(--line); border-radius:16px; padding:8px 14px; font-size:20px; font-weight:700; min-height:56px}
.title{font-size:22px; font-weight:700; text-align:center; flex:1; line-height:1.3}
.stars{display:inline-flex; align-items:center; gap:6px; background:#fff; border:3px solid #F5D98B; border-radius:999px; padding:6px 14px; font-weight:700; font-size:22px; min-height:52px; white-space:nowrap}
.stars.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

/* Home */
.hello{font-size:44px; font-weight:700; margin:6px 0 0; line-height:1.3}
.sub{font-size:21px; color:var(--ink-soft); margin:2px 0 16px}
.modes{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.mode{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:150px; border-radius:24px; border:3px solid rgba(0,0,0,.12); box-shadow:0 5px 0 rgba(0,0,0,.14); font-size:22px; font-weight:700; padding:12px 8px; line-height:1.25; text-align:center}
.mode:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.14)}
.mode .emoji{font-size:58px}
.mode.wide{grid-column:1 / -1; min-height:120px; flex-direction:row; gap:18px}
.m-learn{background:#D4E9FF}.m-build{background:#FFE2B8}.m-hunt{background:#D8F3D2}.m-math{background:#F1DDFA}.m-quiz{background:#FFF1A8}
.grown-link{display:block; margin:26px auto 0; background:transparent; border:2px dashed #C9BB98; border-radius:14px; padding:10px 18px; font-size:18px; color:var(--ink-soft)}

/* Cards and big words */
.card{background:var(--card); border:3px solid var(--line); border-radius:28px; padding:18px 14px; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.06)}
.pic{font-size:88px; line-height:1.1; margin:4px 0}
.bigword{font-size:clamp(72px, 22vw, 150px); font-weight:700; letter-spacing:.14em; line-height:1.15; margin:4px 0}
.v{color:var(--vowel)}
.segs{display:flex; justify-content:center; align-items:center; gap:8px; margin:8px 0 4px; flex-wrap:nowrap}
.seg{min-width:72px; height:78px; font-size:44px; font-weight:700; background:#fff; border:3px solid var(--line); border-radius:16px; padding:0 8px; letter-spacing:0}
.seg.vowel{color:var(--vowel); background:var(--vowel-bg); border-color:#B9D2F1}
.seg.lit{background:#FFF3B0; border-color:#F2A900; transform:scale(1.08)}
.dash{font-size:34px; color:#999; letter-spacing:0}
.note{font-size:18px; background:var(--vowel-bg); border-radius:14px; padding:10px 12px; margin:12px 0 0; line-height:1.5; text-align:left}
.sentence{font-size:19px; color:var(--ink-soft); margin:10px 0 0}

/* Buttons */
.row{display:flex; gap:12px; justify-content:center; margin:14px 0 0; flex-wrap:wrap}
.btn{min-height:68px; padding:10px 20px; border-radius:var(--radius); border:3px solid var(--btn-dark); background:var(--btn); color:#fff; font-size:24px; font-weight:700; box-shadow:0 5px 0 var(--btn-dark); display:inline-flex; align-items:center; justify-content:center; gap:10px; line-height:1.2}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--btn-dark)}
.btn.alt{background:#fff; color:var(--ink); border-color:#BFAF8A; box-shadow:0 5px 0 #BFAF8A}
.btn.go{background:var(--good); border-color:#1D5A21; box-shadow:0 5px 0 #1D5A21}
.btn.huge{font-size:30px; min-height:84px; padding:12px 28px}
.btn.speak{font-size:26px; min-height:88px; min-width:110px; white-space:nowrap}
.btn.speak .emoji{font-size:40px}
.btn[disabled]{opacity:.45}
.btn.flex1{flex:1 1 140px}
.navrow{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px}
.navrow .count{font-size:20px; color:var(--ink-soft)}
.arrow{width:92px; min-height:72px}
.arrow svg{width:34px; height:34px}

/* Feedback */
.feedback{min-height:64px; margin:14px 0 0; border-radius:18px; padding:12px; font-size:24px; font-weight:700; text-align:center; line-height:1.35}
.feedback.good{background:var(--good-bg); color:#1D5A21}
.feedback.gentle{background:var(--gentle-bg); color:var(--gentle)}
.feedback.show{background:var(--vowel-bg); color:#173F73}
.progress{display:flex; gap:6px; justify-content:center; margin:0 0 10px; flex-wrap:wrap}
.progress i{width:14px; height:14px; border-radius:50%; background:#E7DCC2; display:block}
.progress i.done{background:var(--star)}
.progress i.now{background:var(--btn); transform:scale(1.3)}
.prompt{font-size:22px; margin:4px 0 8px; text-align:center}

/* Build the word */
.boxes{display:flex; justify-content:center; gap:12px; margin:14px 0}
.box{width:92px; height:104px; border:4px dashed #BFAF8A; border-radius:18px; background:#fff; font-size:60px; font-weight:700; display:flex; align-items:center; justify-content:center; letter-spacing:0; padding:0}
.box.filled{border-style:solid; border-color:#8FA9C9}
.box.right{border-color:var(--good); background:var(--good-bg)}
.box.v{color:var(--vowel)}
.tiles{display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin:8px auto 0; max-width:420px}
.tile{width:84px; height:88px; background:#fff; border:3px solid #BFAF8A; border-radius:18px; box-shadow:0 5px 0 #BFAF8A; font-size:52px; font-weight:700; letter-spacing:0; padding:0}
.tile:active{transform:translateY(3px); box-shadow:0 2px 0 #BFAF8A}
.tile.v{color:var(--vowel)}
.tile.used{visibility:hidden}

/* Word hunt */
.choices{display:grid; grid-template-columns:1fr; gap:14px; margin-top:14px}
.choice{min-height:96px; font-size:54px; font-weight:700; background:#fff; border:3px solid #BFAF8A; border-radius:22px; box-shadow:0 5px 0 #BFAF8A; letter-spacing:.14em}
.choice:active{transform:translateY(3px); box-shadow:0 2px 0 #BFAF8A}
.choice.faded{opacity:.35; box-shadow:none}
.choice.right{background:var(--good-bg); border-color:var(--good); box-shadow:0 5px 0 var(--good)}

/* Math */
.problem{font-size:clamp(56px, 17vw, 100px); font-weight:700; letter-spacing:0; line-height:1.1; margin:0 0 6px; white-space:nowrap}
.problem .op{margin:0 .18em}
.mathcard{padding:12px 10px}
.count-btn{font-size:17px; min-height:48px; padding:4px 12px; border-radius:14px; box-shadow:0 4px 0 #BFAF8A}
.dots-cap{display:flex; align-items:center; justify-content:center; gap:6px 12px; flex-wrap:wrap; margin:0 0 4px}
.numline .nexttxt.on{fill:#B35F00}
.grown{letter-spacing:.05em}
.problem .q{color:var(--vowel)}
.dots-area{display:flex; align-items:center; justify-content:center; gap:14px; margin:8px 0; flex-wrap:nowrap}
.dotrows{display:flex; flex-direction:column; gap:6px}
.dotrow{display:flex; gap:7px}
.dotgrp{display:flex; gap:7px; padding:5px; border-radius:12px; background:#EEF3FA}
.dotc{width:26px; height:26px; border-radius:50%; background:var(--dot); display:block; border:0; padding:0}
.dotc.plus{background:var(--dot-plus); width:34px; height:34px}
.dotc.lit{box-shadow:0 0 0 5px #F2A900}
.plus-sign{font-size:40px; font-weight:700; letter-spacing:0}
.dots-cap{font-size:19px; color:var(--ink-soft); margin:0}
.numline{width:100%; max-width:460px; display:block; margin:0 auto}
.numline text{font-family:var(--font); font-weight:700; letter-spacing:0}
.answers{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px}
.answer{min-height:100px; font-size:56px; font-weight:700; background:#fff; border:3px solid #BFAF8A; border-radius:22px; box-shadow:0 5px 0 #BFAF8A; letter-spacing:.04em}
.answer:active{transform:translateY(3px); box-shadow:0 2px 0 #BFAF8A}
.answer.faded{opacity:.35; box-shadow:none}
.answer.right{background:var(--good-bg); border-color:var(--good); box-shadow:0 5px 0 var(--good)}
.helper{background:#FFF3B0; color:var(--ink); border:3px solid #E9C95A; box-shadow:0 5px 0 #E9C95A; font-size:19px; min-height:88px; padding:8px 12px; letter-spacing:.06em}
.hop{opacity:0; transition:opacity .4s}
.hop.on{opacity:1}

/* End screen */
.end{text-align:center; padding:10px 0}
.end h2{font-size:40px; margin:6px 0; line-height:1.25}
.starrow{display:flex; flex-wrap:wrap; justify-content:center; gap:4px; font-size:36px; letter-spacing:0; line-height:1.3; margin:10px 0}
.practice-list{font-size:20px; color:var(--ink-soft)}

/* Grown-ups */
.grown{line-height:1.7; font-size:18px; text-align:left}
.grown h2{font-size:26px; margin:18px 0 6px}
.grown h3{font-size:21px; margin:16px 0 4px}
.grown p, .grown li{max-width:65ch}
.grown ul{padding-left:1.2em}
.grown table{border-collapse:collapse; width:100%; font-size:17px; background:#fff; border-radius:12px; overflow:hidden}
.grown th, .grown td{border-bottom:1px solid var(--line); padding:8px 6px; text-align:left}
.grown th{background:#F7EED8}
.tip{background:#fff; border:2px solid var(--line); border-radius:14px; padding:10px 14px; margin:10px 0}
.nospeech{background:var(--gentle-bg); color:var(--gentle); border-radius:14px; padding:10px 14px; font-size:18px; margin:10px 0; display:none}
.nospeech.on{display:block}

.fly{position:fixed; font-size:54px; pointer-events:none; z-index:50; animation:fly 1s ease-in forwards}
@keyframes fly{0%{opacity:1; transform:translate(0,0) scale(1)}100%{opacity:0; transform:translate(var(--dx), var(--dy)) scale(.4)}}

@media (min-width:700px){
  .modes{grid-template-columns:1fr 1fr 1fr}
  .mode.wide{grid-column:auto; flex-direction:column; min-height:150px; gap:6px}
  .choices{grid-template-columns:1fr 1fr 1fr}
  .answers{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:360px){
  body{font-size:18px}
  .tile{width:72px; height:80px; font-size:46px}
  .box{width:80px; height:94px; font-size:52px}
  .dotc{width:22px; height:22px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}

/* Build the word: Undo */
.undo-row{margin:0 0 6px}
.btn.undo{min-height:72px; font-size:26px; padding:8px 26px; gap:12px}
.btn.undo svg{width:42px; height:30px}
.boxes.many{flex-wrap:wrap}
/* Pictures (emoji or a small photo) */
.picimg{height:1em; width:auto; max-width:2.4em; border-radius:.14em; vertical-align:middle; object-fit:cover}
/* Math: scaled dots, added dots, crossed-out dots */
.dotgrp.addgrp{background:#FDEBD6}
.dotc.add{background:var(--dot-plus)}
.dotc.gone{background:#AFC3DA; position:relative}
.dotc.gone::before, .dotc.gone::after{content:""; position:absolute; left:-4px; right:-4px; top:50%; height:4px; margin-top:-2px; border-radius:2px; background:#444}
.dotc.gone::before{transform:rotate(45deg)}
.dotc.gone::after{transform:rotate(-45deg)}
.dots-sm .dotc{width:20px; height:20px}
.dots-sm .dotc.plus{width:28px; height:28px}
.dots-sm .dotrow, .dots-sm .dotgrp{gap:5px}
.dots-sm .dotrows{gap:5px}
.problem.long{font-size:clamp(46px, 13.5vw, 90px)}

/* Grown-up check */
.gate{max-width:460px; margin:10px auto 0}
.gate label{display:block; font-size:28px; font-weight:700; margin:6px 0 10px; letter-spacing:.06em}
.gate input{font-family:inherit; font-size:40px; font-weight:700; text-align:center; width:170px; padding:6px 10px; border:3px solid var(--line); border-radius:16px; background:#fff; color:var(--ink); letter-spacing:.08em}
.gate input:focus{outline:4px solid #F2A900; border-color:#F2A900}

/* Edit words & math */
.ed{font-size:18px; line-height:1.55; letter-spacing:.05em; text-align:left}
.ed h2{font-size:25px; margin:22px 0 6px; line-height:1.3}
.ed .lbl{display:block; font-weight:700; margin:12px 0 4px}
.ed .hint{font-size:16px; color:var(--ink-soft); margin:4px 0 0}
.ed input[type=text], .ed select, .ed textarea{font-family:inherit; font-size:20px; letter-spacing:.05em; width:100%; padding:8px 12px; border:3px solid var(--line); border-radius:14px; background:#fff; color:var(--ink); min-height:54px}
.ed textarea{min-height:96px; font-size:15px; letter-spacing:0; line-height:1.4; font-family:ui-monospace, Menlo, Consolas, monospace; resize:vertical}
.ed textarea.plain{font-family:inherit; font-size:19px; letter-spacing:.05em}
.ed input:focus, .ed select:focus, .ed textarea:focus{outline:3px solid #F2A900; border-color:#F2A900}
.smallbtn{min-height:52px; padding:6px 14px; font-size:18px; font-weight:700; border-radius:14px; border:3px solid #BFAF8A; background:#fff; box-shadow:0 3px 0 #BFAF8A; letter-spacing:.04em; display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.smallbtn:active{transform:translateY(2px); box-shadow:0 1px 0 #BFAF8A}
.smallbtn .emoji{font-size:22px}
.wrow{background:#fff; border:3px solid var(--line); border-radius:18px; padding:10px; margin:10px 0}
.wrow.bad{border-color:#D69A1E; background:#FFF7E0}
.wrow-top, .wrow-mid{display:flex; gap:8px; align-items:center}
.wrow-mid{margin:8px 0}
.wnum{font-weight:700; color:var(--ink-soft); min-width:1.7em; text-align:right}
.ed .wrow input.w{flex:1 1 auto; min-width:0; font-size:28px; font-weight:700; letter-spacing:.14em; padding:4px 12px}
.ed .wrow input.p{flex:0 1 7em; min-width:0; text-align:center; font-family:var(--emoji); font-size:24px; letter-spacing:0}
.picprev{flex:0 0 auto; width:58px; height:54px; font-size:40px; line-height:54px; text-align:center}
.picprev .none{font-size:13px; line-height:1.2; color:var(--ink-soft); display:inline-block; letter-spacing:0}
.filebtn{position:relative; overflow:hidden; cursor:pointer}
.filebtn input{position:absolute; left:0; top:0; width:1px; height:1px; opacity:0}
.optrow{display:flex; gap:10px}
.opt{flex:1; min-height:60px; font-size:22px; font-weight:700; border-radius:16px; border:3px solid #BFAF8A; background:#fff; box-shadow:0 4px 0 #BFAF8A}
.opt.on{background:var(--vowel-bg); border-color:var(--btn); box-shadow:0 4px 0 var(--btn); color:#173F73}
.inline3{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:10px}
.preview{background:#fff; border:2px dashed var(--line); border-radius:14px; padding:8px 12px; margin:10px 0 0; font-size:17px}
.edmsg{border-radius:14px; padding:10px 14px; margin:12px 0 0; font-weight:700; font-size:18px}
.edmsg:empty{display:none}
.edmsg.ok{background:var(--good-bg); color:#1D5A21}
.edmsg.err{background:var(--gentle-bg); color:var(--gentle)}
.edmsg ul{margin:4px 0 0; padding-left:1.2em; font-weight:400}
.savebar{position:sticky; bottom:0; background:var(--bg); padding:10px 0 8px; margin-top:18px; border-top:2px solid var(--line); z-index:5}
.savebar .row{margin:0}
.dirty{font-size:16px; color:var(--gentle); text-align:center; margin:4px 0 0; min-height:1.4em}

/* ---------- Blocky mining theme (original pixel art drawn in CSS/SVG; reading text stays Andika on cream) ---------- */

.px{display:block; image-rendering:pixelated}

'1' height='1' fill='%236B4222'/%3E%3Crect x='12' y='7' width='1' height='1' fill='%237A4E24'/%3E%3Crect x='14' y='7' width='1' height='1' fill='%237A4E24'/%3E%3Crect x='3' y='8' width='1' height='1' fill='%237A4E24'/%3E%3Crect x='6' y='7' width='1' height='1' fill='%237A4E24'/%3E%3Crect x='7' y='8' width='1' height='1' fill='%23A87440'/%3E%3Crect x='15' y='5' width='1' height='1' fill='%237A4E24'/%3E%3Crect x='14' y='8' width='1' height='1' fill='%236B4222'/%3E%3C/svg%3E") repeat-x; background-size:48px 30px; image-rendering:pixelated}
.hello, .title, .end h2, .craftcard h2{text-shadow:2px 2px 0 #D7E8C4}
.hello{text-shadow:3px 3px 0 #CFE3B5}
.home-btn{border-radius:10px; box-shadow:0 3px 0 var(--line)}
.stars{border-radius:10px; border-color:var(--dirt); box-shadow:0 3px 0 var(--dirt-dark)}
.stars .pxstar{width:26px; height:26px}
.fly.pxfly svg, .fly .pxstar{width:44px; height:44px}
.starrow .pxstar{width:34px; height:34px; display:inline-block}
.card{border-radius:16px}
.mode{border-radius:10px; border:4px solid rgba(0,0,0,.26); box-shadow:inset 0 5px 0 rgba(255,255,255,.45), inset 0 -6px 0 rgba(0,0,0,.08), 0 6px 0 rgba(0,0,0,.26)}
.mode:active{box-shadow:inset 0 5px 0 rgba(255,255,255,.45), 0 2px 0 rgba(0,0,0,.26)}
.m-learn{background:#CDEBB5}.m-build{background:#F0DAB8}.m-hunt{background:#DEDED8}.m-math{background:#CBEFF6}.m-quiz{background:#FFE9A8}
.m-game{background:linear-gradient(#6DBB45 0 18px, #4E9632 18px 22px, #E2BC8A 22px)}
.m-game .px{width:62px; height:62px; margin-top:8px}
.btn, .choice, .answer, .tile, .box, .seg, .opt, .smallbtn{border-radius:10px}

@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.home-av .av-armR{animation:wave 5s ease-in-out infinite 1s}
@keyframes wave{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-150deg)}82%{transform:rotate(-125deg)}88%{transform:rotate(-150deg)}94%{transform:rotate(0)}}

.gask .problem.long{font-size:clamp(34px, 9vw, 70px)}
.gsay{font-size:22px; font-weight:700; margin:0; line-height:1.3; text-align:center}
.quarry{position:relative; display:flex; justify-content:space-around; align-items:center; gap:8px; padding:18px 8px 26px; margin-top:6px; border-radius:12px; overflow:hidden;

.oreblock .plate{position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); background:#FFF8E7; color:var(--ink); border:3px solid #3B3B3B; border-radius:6px; padding:6px 7px; font-weight:700; letter-spacing:.08em; line-height:1.1; white-space:nowrap; max-width:96%}

/* ---------------- 1. Learn Words ---------------- */
var learnIdx = 0, learnedThisVisit = {};
function learn(){
  if (learnIdx >= WORDS.length) learnIdx = 0;
  var o = WORDS[learnIdx], n = o.w.length, pos = hiPositions(o.w);
  /* Longer custom words: shrink letter boxes so the whole word fits on one line */
  var dashes = n <= 4, segStyle = '', wordStyle = '';
  if (n > 3){
    var avail = viewW() - 66, gaps = dashes ? (n-1)*14 + (2*n-2)*8 : (n-1)*6;
    var sw = Math.max(28, Math.min(72, Math.floor((avail - gaps) / n)));
    segStyle = ' style="min-width:0;width:'+sw+'px;padding:0;font-size:'+Math.min(44, Math.round(sw*0.62))+'px;height:'+Math.max(48, Math.min(78, Math.round(sw*1.1)))+'px"';
    wordStyle = ' style="font-size:clamp(34px, calc(64vw / '+n+'), 150px)"';
  }
  var segs = o.w.split('').map(function(c, i){
    return (i && dashes ? '<span class="dash" aria-hidden="true">-</span>' : '') + '<button class="seg'+(pos[i]?' vowel':'')+'" data-l="'+c+'" aria-label="sound of '+c+'"'+segStyle+'>'+c+'</button>';
  }).join('');
  var nasal = LIST.pattern === 'a' && /a[mn]/.test(o.w);
  shell('Learn Words',
    '<div class="card">' +
      (o.pic ? '<div class="pic emoji" aria-hidden="true">'+picHTML(o.pic)+'</div>' : '') +
      '<div class="bigword" aria-label="'+o.w+'"'+wordStyle+'>'+colorWord(o.w)+'</div>' +
      '<div class="segs"'+(dashes ? '' : ' style="gap:6px"')+'>'+segs+'</div>' +
      (o.s ? '<div class="sentence">'+esc(o.s).replace(new RegExp('\\b'+o.w+'\\b', 'i'), '<b>$&</b>')+'</div>' : '') +
      (nasal ? '<div class="note"><span class="emoji" aria-hidden="true">👂</span> Listen! The <b class="v">a</b> sounds a little different before <b>m</b> or <b>n</b>.</div>' : '') +
    '</div>' +
    '<div class="row">' +
      '<button class="btn speak flex1" data-act="say"><span class="emoji" aria-hidden="true">🔊</span>Hear it</button>' +
      '<button class="btn alt flex1" data-act="sound"><span class="emoji" aria-hidden="true">🐢</span>Sound it out</button>' +
    '</div>' +
    '<div class="row"><button class="btn go huge" data-act="read"><span class="emoji" aria-hidden="true">⭐</span>I can read it!</button></div>' +
    '<div class="navrow">' +
      '<button class="btn alt arrow" data-act="prev" aria-label="Back">'+SVG_LEFT+'</button>' +
      '<span class="count">'+(learnIdx+1)+' of '+WORDS.length+'</span>' +
      '<button class="btn alt arrow" data-act="next" aria-label="Next">'+SVG_RIGHT+'</button>' +
    '</div>'
  );
  var segBtns = $all('.seg');
  function lit(idx){ segBtns.forEach(function(b, i){ b.classList.toggle('lit', idx.indexOf(i) >= 0); }); }
  $('[data-act=say]').onclick = function(){ speakWordSentence(o); };
  $('[data-act=sound]').onclick = function(){
    var all = range(n), first = {text: SOUND[o.w[0]] || o.w[0], before:function(){ lit([0]); }, gap:350};
    if (o.rime){
      /* word family: first sound, then the rest (b… ag…), then blend slowly, then say it */
      Speech.seq([
        first,
        {text: o.rime, before:function(){ lit(all.slice(1)); }, gap:350},
        {text: o.w, rate:0.55, before:function(){ lit(all); }, gap:300},
        {text: o.w, gap:100}
      ], function(){ lit([]); });
    } else {
      /* any other word: first sound, then the word slowly, then the word */
      Speech.seq([
        first,
        {text: o.w, rate:0.55, before:function(){ lit(all); }, gap:300},
        {text: o.w, gap:100}
      ], function(){ lit([]); });
    }
  };
  segBtns.forEach(function(b){ b.onclick = function(){ var c = b.getAttribute('data-l'); lit([segBtns.indexOf(b)]); Speech.say(SOUND[c] || c, null, function(){ lit([]); }); }; });
  $('[data-act=read]').onclick = function(e){
    var fb = e.currentTarget;
    if (!learnedThisVisit[o.w]){ learnedThisVisit[o.w] = true; var d = load(); d.learned[o.w] = (d.learned[o.w]||0) + 1; save(); addStar(fb); }
    Speech.say(pick(PRAISE) + ' ' + o.w + '!', null, function(){ learnNext(); });
  };
  $('[data-act=prev]').onclick = function(){ learnIdx = (learnIdx + WORDS.length - 1) % WORDS.length; learn(); speakWord(WORDS[learnIdx].w); };
  $('[data-act=next]').onclick = function(){ learnNext(); };
  function learnNext(){ learnIdx = (learnIdx + 1) % WORDS.length; learn(); speakWord(WORDS[learnIdx].w); }
}

/* ---------------- Round runner (shared by games and quiz) ---------------- */
function runRound(cfg){
  /* cfg: {title, items:[{type, id}], quiz:bool, key} */
  var i = 0, got = 0, missed = [];
  function show(){
    if (i >= cfg.items.length) return finish();
    var it = cfg.items[i];
    shell(cfg.title, progressDots(i, cfg.items.length) + '<div id="stage"></div><div class="row" id="nextRow"></div>');
    var stage = $('#stage');
    var render = it.type === 'build' ? renderBuild : it.type === 'hunt' ? renderHunt : renderMath;
    render(stage, it.id, cfg, function(res){
      if (res.correct) got++; else missed.push(it.type === 'math' ? factText(factById(it.id)) : it.id);
      var nr = $('#nextRow');
      nr.innerHTML = '<button class="btn go huge" data-act="next">Next <span aria-hidden="true">'+SVG_RIGHT.replace('<svg','<svg width="30" height="30"')+'</span></button>';
      $('[data-act=next]', nr).onclick = function(){ i++; show(); };
      later(function(){ var b = $('[data-act=next]'); if (b && b.scrollIntoView) b.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 300);
    });
  }
  function finish(){
    var n = cfg.items.length, stars = '';
    for (var k=0;k<got;k++) stars += '<span>'+STAR_SVG+'</span>';
    if (cfg.quiz){ var d = load(); d.quiz.push({date:new Date().toISOString().slice(0,10), kind:cfg.key, got:got, of:n, practice:missed}); if (d.quiz.length > 30) d.quiz = d.quiz.slice(-30); save(); }
    shell(cfg.title,
      '<div class="card end">' +
        avatarHTML('cheer big') +
        '<h2>You did it, Luke!</h2>' +
        '<p style="font-size:24px;margin:0">You earned <b>'+got+'</b> '+(got===1?'star':'stars')+'!</p>' +
        '<div class="starrow" aria-hidden="true">'+(stars || '<span class="emoji">🌟</span>')+'</div>' +
        (missed.length ? '<p class="practice-list">Let’s practice these again: <b>'+missed.map(function(x){ return '<span style="white-space:nowrap">'+esc(x)+'</span>'; }).join(', ')+'</b></p>' : '<p class="practice-list">Every single one! Wow!</p>') +
      '</div>' +
      '<div class="row"><button class="btn go huge" data-act="again">Play again</button><button class="btn alt huge" data-act="home2">'+ICON_HOME+' Home</button></div>'
    );
    $('[data-act=again]').onclick = function(){ cfg.restart(); };
    $('[data-act=home2]').onclick = function(){ go('home'); };
    Speech.say('Hooray! You earned ' + got + (got===1?' star':' stars') + '. Great work, Luke!');
  }
  show();
}

/* ---------------- 2. Build the Word ---------------- */
function makeTiles(word, extra){
  var letters = word.split(''), d = [];
  if (Math.random() < 0.4){
    var c = letters.map(function(l){ return CONFUSE[l]; }).filter(function(x){ return x && letters.indexOf(x) < 0; });
    if (c.length) d.push(pick(c)); /* at most one b/d, p/q or m/n look-alike */
  }
  var pool = shuffle(POOL.filter(function(x){ return letters.indexOf(x) < 0 && d.indexOf(x) < 0 && !CONFUSE[x]; }));
  if (pool.length < extra) pool = pool.concat(shuffle('aeiou'.split('').filter(function(x){ return letters.indexOf(x) < 0; })));
  while (d.length < extra && pool.length) d.push(pool.shift());
  return shuffle(letters.concat(d));
}
function renderBuild(stage, w, cfg, done){
  var o = wordObj(w), n = w.length, tries = 0, finished = false;
  var tiles = makeTiles(w, cfg.quiz ? 3 : 2);
  var slots = range(n).map(function(){ return null; }); /* each: index into tiles */
  var placed = []; /* filled slots in the order they were filled (for Undo) */
  var boxStyle = '', boxesStyle = '';
  if (n > 3){ /* longer words: fit the boxes to the screen */
    var gap = n > 5 ? 6 : 10, bw = Math.max(44, Math.min(92, Math.floor((viewW() - 40 - (n-1)*gap) / n)));
    boxesStyle = ' style="gap:'+gap+'px"';
    boxStyle = ' style="width:'+bw+'px;height:'+Math.round(bw*1.13)+'px;font-size:'+Math.round(bw*0.65)+'px"';
  }
  stage.innerHTML =
    '<p class="prompt">Listen, then build the word.</p>' +
    '<div class="row" style="margin-top:0">' +
      '<button class="btn speak" data-act="say" aria-label="Hear the word"><span class="emoji" aria-hidden="true">🔊</span></button>' +
      (o.s ? '<button class="btn alt" data-act="sent" style="min-height:88px"><span class="emoji" aria-hidden="true">💬</span>Sentence</button>' : '') +
    '</div>' +
    (cfg.quiz || !o.pic ? '' : '<div class="pic emoji" style="font-size:56px;text-align:center;margin-top:8px" aria-hidden="true">'+picHTML(o.pic)+'</div>') +
    '<div class="boxes'+(n > 3 ? ' many' : '')+'"'+boxesStyle+'>' + slots.map(function(x, k){ return '<button class="box" data-slot="'+k+'" aria-label="box '+(k+1)+'"'+boxStyle+'></button>'; }).join('') + '</div>' +
    '<div class="row undo-row"><button class="btn alt undo" data-act="undo" aria-label="Undo, take back the last letter" disabled>'+SVG_UNDO+'<span>Undo</span></button></div>' +
    '<div class="tiles">' + tiles.map(function(c, k){ return '<button class="tile'+(isHiLetter(c) && w.indexOf(c) >= 0 ?' v':'')+'" data-tile="'+k+'">'+c+'</button>'; }).join('') + '</div>' +
    '<div class="feedback" id="fb" role="status"></div>';
  var fb = $('#fb', stage), undoBtn = $('[data-act=undo]', stage);
  function draw(){
    var used = slots.filter(function(x){ return x !== null; });
    $all('.tile', stage).forEach(function(t){ t.classList.toggle('used', used.indexOf(+t.getAttribute('data-tile')) >= 0); });
    $all('.box', stage).forEach(function(b, k){
      var c = slots[k] === null ? '' : tiles[slots[k]];
      b.textContent = c; b.classList.toggle('filled', !!c); b.classList.toggle('v', isHiLetter(c));
      b.setAttribute('aria-label', 'box ' + (k+1) + (c ? ', ' + c + ', tap to take it back' : ''));
    });
    placed = placed.filter(function(k){ return slots[k] !== null; });
    undoBtn.disabled = finished || !used.length;
  }
  function takeBack(k){
    if (finished || slots[k] === null) return;
    slots[k] = null; placed = placed.filter(function(x){ return x !== k; });
    var b = $('.box[data-slot="'+k+'"]', stage); if (b) b.classList.remove('right');
    draw(); fb.className = 'feedback'; fb.textContent = '';
  }
  $('[data-act=say]', stage).onclick = function(){ speakWord(w); };
  var sentBtn = $('[data-act=sent]', stage);
  if (sentBtn) sentBtn.onclick = function(){ speakWordSentence(o); };
  $all('.tile', stage).forEach(function(t){ t.onclick = function(){
    if (finished) return;
    var ti = +t.getAttribute('data-tile'); if (slots.indexOf(ti) >= 0) return;
    var k = slots.indexOf(null); if (k < 0) return;
    slots[k] = ti; placed.push(k); draw();
    var c = tiles[ti];
    if (slots.indexOf(null) < 0) check(); else Speech.say((SOUND[c] || c).split(',')[0]);
  }; });
  /* tap a filled box to send that letter back to the tiles */
  $all('.box', stage).forEach(function(b){ b.onclick = function(){ takeBack(+b.getAttribute('data-slot')); }; });
  /* Undo: take back the last letter placed */
  undoBtn.onclick = function(){ if (placed.length) takeBack(placed[placed.length - 1]); };
  function spelled(){ return slots.map(function(x){ return x === null ? '' : tiles[x]; }).join(''); }
  function check(){
    var s = spelled();
    if (s === w){
      finished = true; draw();
      $all('.box', stage).forEach(function(b){ b.classList.add('right'); });
      var msg = pick(PRAISE); fb.className = 'feedback good'; fb.textContent = msg + ' ' + w + '!';
      record('words', w, true, tries === 0); addStar($('.boxes', stage));
      Speech.seq([{text:msg, gap:200}, {text:w.split('').join(', '), rate:0.7, gap:250}, {text:w}]);
      done({correct:true});
      return;
    }
    tries++;
    if (tries < 2){
      fb.className = 'feedback gentle'; fb.textContent = pick(TRY);
      Speech.seq([{text: fb.textContent, gap:300}, {text:w}]);
      /* keep letters that are in the right place, gently return the others */
      $all('.box', stage).forEach(function(b, k){ if (tiles[slots[k]] === w[k]) b.classList.add('right'); });
      later(function(){ if (finished) return; for (var k=0;k<n;k++) if (slots[k] !== null && tiles[slots[k]] !== w[k]) slots[k] = null; draw(); }, 900);
    } else {
      finished = true;
      /* show the right answer (each tile used once, so double letters work) */
      var usedT = [];
      slots = w.split('').map(function(c){ for (var k=0;k<tiles.length;k++) if (tiles[k] === c && usedT.indexOf(k) < 0){ usedT.push(k); return k; } return null; });
      draw(); $all('.box', stage).forEach(function(b){ b.classList.add('right'); });
      fb.className = 'feedback show'; fb.innerHTML = 'Good try! This is how we spell <b>'+colorWord(w)+'</b>.';
      record('words', w, false, false);
      Speech.seq([{text:'Good try! This is how we spell ' + w + '.', gap:250}, {text:w.split('').join(', '), rate:0.7, gap:250}, {text:w}]);
      done({correct:false});
    }
  }
  later(function(){ speakWord(w); }, 350);
}
function build(){
  var cfg = {title:'Build the Word', quiz:false, key:'build'};
  cfg.items = shuffle(WORDS).map(function(o){ return {type:'build', id:o.w}; });
  cfg.restart = build; runRound(cfg);
}

/* ---------------- 3. Word Hunt ---------------- */
function okNear(x, w){ return x && x !== w && !wordObj(x) && !BAD_EXACT.test(x) && !BAD_PART.test(x); }
/* Near-miss spellings: hand-picked ones for this week's words, otherwise made by changing or swapping a letter */
function nearMisses(w){
  var out = [], seen = {};
  function add(x){ if (!seen[x] && okNear(x, w)){ seen[x] = 1; out.push(x); } }
  var hand = shuffle((NEAR[w] || []).filter(function(x){ return okNear(x, w); }));
  hand.forEach(add);
  if (out.length >= 2) return out;
  var L = w.split(''), pos = hiPositions(w), gen = [];
  function rep(i, c){ var a = L.slice(); a[i] = c; return a.join(''); }
  L.forEach(function(c, i){
    var inPattern = pos[i] && !isVowel(c); /* keep the blue consonant pattern (e.g. "sh") so it still shows */
    if (inPattern) return;
    if (CONFUSE[c]) gen.push(rep(i, CONFUSE[c]));
    if (isVowel(c)) shuffle('aeiou'.split('').filter(function(v){ return v !== c; })).slice(0, 2).forEach(function(v){ gen.push(rep(i, v)); });
    else shuffle(POOL.filter(function(p){ return p !== c; })).slice(0, 2).forEach(function(p){ gen.push(rep(i, p)); });
  });
  for (var i=0;i<L.length-1;i++){ if (L[i] !== L[i+1]){ var a = L.slice(); a[i] = L[i+1]; a[i+1] = L[i]; gen.push(a.join('')); } }
  shuffle(gen).forEach(add);
  /* last resort (very short words): add a letter */
  for (var g=0; out.length < 2 && g < 60; g++){ add(w + pick('tsdgpn'.split(''))); add(pick('bstp'.split('')) + w); }
  return out;
}
function renderHunt(stage, w, cfg, done){
  var o = wordObj(w), tries = 0, finished = false;
  var near = nearMisses(w);
  var others = shuffle(WORDS.filter(function(x){ return x.w !== w && Math.abs(x.w.length - w.length) <= 1 && (NEAR[w] || []).indexOf(x.w) < 0; }).map(function(x){ return x.w; }));
  var opts = shuffle([w, near[0], (Math.random() < 0.5 && others.length) ? others[0] : near[1]]);
  /* Color the same letter slot as the real word (so blue letters never give the answer away) */
  var tpos = hiPositions(w);
  function colored(x){
    var pos = hiPositions(x);
    if (x.length === w.length) for (var k in tpos) if (isVowel(x[k]) && isVowel(w[k])) pos[k] = 1;
    return colorWord(x, pos);
  }
  var maxLen = Math.max.apply(null, opts.map(function(x){ return x.length; })), chStyle = '';
  if (maxLen > 4){
    var colW = viewW() >= 700 ? (viewW() - 60) / 3 : viewW() - 44;
    chStyle = ' style="font-size:'+Math.max(22, Math.min(54, Math.floor(colW / (maxLen * 0.8))))+'px"';
  }
  stage.innerHTML =
    '<p class="prompt">Listen. Find the word!</p>' +
    '<div class="row" style="margin-top:0">' +
      '<button class="btn speak" data-act="say" aria-label="Hear the word"><span class="emoji" aria-hidden="true">🔊</span></button>' +
      (o.s ? '<button class="btn alt" data-act="sent" style="min-height:88px"><span class="emoji" aria-hidden="true">💬</span>Sentence</button>' : '') +
    '</div>' +
    '<div class="choices">' + opts.map(function(x){ return '<button class="choice" data-w="'+x+'"'+chStyle+'>'+colored(x)+'</button>'; }).join('') + '</div>' +
    '<div class="feedback" id="fb" role="status"></div>';
  var fb = $('#fb', stage);
  $('[data-act=say]', stage).onclick = function(){ speakWord(w); };
  var sentBtn = $('[data-act=sent]', stage);
  if (sentBtn) sentBtn.onclick = function(){ speakWordSentence(o); };
  $all('.choice', stage).forEach(function(b){ b.onclick = function(){
    if (finished || b.classList.contains('faded')) return;
    var x = b.getAttribute('data-w');
    if (x === w){
      finished = true; b.classList.add('right');
      $all('.choice', stage).forEach(function(c){ if (c !== b) c.classList.add('faded'); });
      var msg = pick(PRAISE); fb.className = 'feedback good'; fb.innerHTML = esc(msg) + (o.pic ? ' <span class="emoji">'+picHTML(o.pic)+'</span>' : '');
      record('words', w, true, tries === 0); addStar(b);
      Speech.seq([{text:msg, gap:200}, {text:w}]);
      done({correct:true}); return;
    }
    tries++; b.classList.add('faded');
    if (tries < 2){
      fb.className = 'feedback gentle'; fb.textContent = pick(TRY);
      Speech.seq([{text:fb.textContent, gap:300}, {text:w}]);
    } else {
      finished = true;
      $all('.choice', stage).forEach(function(c){ if (c.getAttribute('data-w') === w) { c.classList.remove('faded'); c.classList.add('right'); } else c.classList.add('faded'); });
      fb.className = 'feedback show'; fb.innerHTML = 'Good try! This one says <b>'+colorWord(w)+'</b>.';
      record('words', w, false, false);
      Speech.seq([{text:'Good try! This one says ' + w + '.', gap:250}, {text:w.split('').join(', '), rate:0.7, gap:250}, {text:w}]);
      done({correct:false});
    }
  }; });
  later(function(){ speakWord(w); }, 350);
}
function hunt(){
  var cfg = {title:'Word Hunt', quiz:false, key:'hunt'};
  cfg.items = shuffle(WORDS).map(function(o){ return {type:'hunt', id:o.w}; });
  cfg.restart = hunt; runRound(cfg);
}

/* ---------------- 4. Math (+1 by default; any + or − set up to 20) ---------------- */
function dotGroups(n, startIdx, opts){
  /* rows of up to 5 dots (groups of five); opts: {add:bool, goneFrom:index} */
  var rows = [], left = n, idx = startIdx;
  while (left > 0){
    var take = Math.min(5, left), row = '<div class="dotrow"><span class="dotgrp'+(opts.add ? ' addgrp' : '')+'">';
    for (var k=0;k<take;k++){
      var gone = opts.goneFrom != null && idx >= opts.goneFrom;
      row += '<span class="dotc'+(opts.add ? ' add' : '')+(gone ? ' gone' : '')+'" data-i="'+(idx++)+'"></span>';
    }
    rows.push(row + '</span></div>'); left -= take;
  }
  return '<div class="dotrows" aria-hidden="true">' + rows.join('') + '</div>';
}
function dotsHTML(f){
  if (f.op === '+'){
    var small = f.a > 15 || (f.b > 1 && Math.min(f.a, 5) + Math.min(f.b, 5) > 7);
    return '<div class="dots-area'+(small ? ' dots-sm' : '')+'">' + dotGroups(f.a, 0, {}) +
      '<span class="plus-sign" aria-hidden="true">+</span>' +
      (f.b === 1 ? '<span class="dotc plus" data-i="'+f.a+'" aria-hidden="true"></span>' : dotGroups(f.b, f.a, {add:true})) + '</div>';
  }
  /* take away: all the dots, with the ones taken away crossed out */
  return '<div class="dots-area'+(f.a > 15 ? ' dots-sm' : '')+'">' + dotGroups(f.a, 0, {goneFrom: f.ans}) + '</div>';
}
function numlineSVG(f){
  var a = f.a, ans = f.ans, dir = f.op === '+' ? 1 : -1, lo = Math.min(a, ans), hi = Math.max(a, ans);
  var start = Math.max(0, lo - 3), count = Math.max(8, hi - start + 2), W = 400, step = W / count, y = 62;
  var fs = count <= 8 ? 24 : count <= 14 ? Math.max(15, Math.round(step * 0.6)) : 17;
  function X(v){ return step*(v - start) + step/2; }
  var s = '<svg class="numline" viewBox="0 0 '+W+' 100" role="img" aria-label="number line">';
  s += '<line x1="6" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="#8C7F63" stroke-width="3" stroke-linecap="round"/>';
  for (var k=0;k<count;k++){
    var v = start + k, x = X(v);
    s += '<line x1="'+x+'" y1="'+(y-8)+'" x2="'+x+'" y2="'+(y+8)+'" stroke="#8C7F63" stroke-width="3"/>';

  var sorted = f.slice().sort(function(x, y){ return x.a - y.a; });
  return (m.op === '+' ? '+' : '−') + m.k + ' facts, ' + factText(sorted[0]) + ' through ' + factText(sorted[sorted.length-1]) + ' (' + f.length + ' problems).';
}
function patternSentence(){
  var p = LIST.pattern, ex = wordObj('cap') ? 'cap' : WORDS[0].w;
  var split = ' and words are split into sounds (' + ex.split('').join(' - ') + ').';
  if (!p) return 'Vowels are always blue,' + split;
  return (p.length === 1 && isVowel(p) ? 'The vowel ' : 'The letters ') + '<span class="v"><b>' + p + '</b></span> ' + (p.length === 1 ? 'is' : 'are') + ' always blue,' + split;
}
function grownups(){

  shell('For Grown-ups',

      '<li><b>Build the Word</b>: he hears a word and taps letter tiles to spell it. Tap a filled box to take that letter back out, or tap <b>Undo</b> to take back the last letter.</li>' +

      '<li><b>Write It</b>: he hears the word and writes it with a finger, Apple Pencil or mouse on handwriting lines. First pass has dotted letters to trace (Trace on); the second pass is without. <b>Check</b> shows the real spelling under his writing; he decides “I got it” or “Practice again” (no auto-grading). Stars for trying and for “got it”. The <b>Handwritten Quiz</b> (in Quiz Practice) has him write up to 10 words, then review each drawing next to the correct spelling. Results show in the “Written” column below.</li>' +
      '<li><b>Block Mine</b>: a blocky mining game. He hears a word or a math problem, then taps the ore block with the right answer to mine it. No timer, nothing to lose: a wrong tap just shakes the block and repeats the question, and after 2 misses the right block glows. Every 10 blocks mined crafts a reward (pickaxe, sword, helmet, house…) for his <b>My Crafts</b> shelf. The helmet shows up on his character.</li>' +

    '<h3>This week</h3>' +
    '<p><b>Spelling, '+esc(LIST.title)+':</b> '+WORDS.map(function(o){ return o.w; }).join(', ')+'.' +
      (dflt ? '<br>Sheet hint: short <span class="v"><b>a</b></span> sounds a little different before <b>m</b> or <b>n</b> (fan, jam, pan, yam). The app points this out on those cards.' : '') + '</p>' +
    (dflt ? '<p><b>Math:</b> +1 facts, 1 + 1 through 12 + 1. The big idea: “plus 1 means the next number.”</p>'
          : '<p><b>Math:</b> ' + esc(mathDescription(LIST)) + '</p>') +

    '<table><thead><tr><th>Word</th><th>Right / tries</th><th>First try</th><th>Written ✅ / tries</th></tr></thead><tbody>'+wordRows+'</tbody></table>' +

  $('[data-act=edit]').onclick = function(){ go('edit'); };

}

/* ---------------- Edit words & math (behind a light grown-up check) ---------------- */
var editUnlocked = false, draft = null, dirty = false;
function edit(){
  if (!editUnlocked) return gate();
  if (!draft){ draft = clone(LIST); dirty = false; }
  renderEditor();
}
function gate(){
  var a = 11 + Math.floor(Math.random() * 9), b = 4 + Math.floor(Math.random() * 6);
  shell('Grown-ups only',
    '<div class="card gate">' +
      '<div class="pic emoji" aria-hidden="true" style="font-size:64px">🔒</div>' +
      '<p style="font-size:20px; margin:0 0 4px">Quick grown-up check</p>' +
      '<label for="gateAns" id="gateQ" data-a="'+a+'" data-b="'+b+'">What is '+a+' + '+b+'?</label>' +
      '<input id="gateAns" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="3" aria-describedby="gateFb">' +
      '<div class="row"><button class="btn go" data-act="gateok">Continue</button><button class="btn alt" data-act="back">Back</button></div>' +
      '<div class="feedback" id="gateFb" role="status"></div>' +
    '</div>');
  var inp = $('#gateAns'), fb = $('#gateFb');
  function check(){
    if (toInt(inp.value.replace(/\D/g, ''), -1) === a + b){ editUnlocked = true; draft = clone(LIST); dirty = false; renderEditor(); }
    else { fb.className = 'feedback gentle'; fb.textContent = 'Not quite. Please try again.'; inp.value = ''; inp.focus(); }
  }
  $('[data-act=gateok]').onclick = check;
  inp.onkeydown = function(e){ if (e.key === 'Enter') check(); };
  $('[data-act=back]').onclick = function(){ go('grownups'); };
}
function selectHTML(id, from, to, val){
  var h = '<select id="'+id+'">';
  for (var v=from; v<=to; v++) h += '<option value="'+v+'"'+(v === val ? ' selected' : '')+'>'+v+'</option>';
  return h + '</select>';
}
function wordRowHTML(o, i){
  return '<div class="wrow" data-i="'+i+'">' +
    '<div class="wrow-top"><span class="wnum">'+(i+1)+'.</span>' +
      '<input class="w" type="text" aria-label="Word '+(i+1)+'" placeholder="word" value="'+esc(o.w)+'" maxlength="14" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false">' +
      '<button class="smallbtn" data-del="'+i+'" aria-label="Delete word '+(i+1)+'"><span class="emoji" aria-hidden="true">🗑️</span>Delete</button></div>' +
    '<div class="wrow-mid"><span class="picprev emoji" aria-hidden="true">'+(o.pic ? picHTML(o.pic) : '<span class="none">no picture</span>')+'</span>' +
      '<input class="p" type="text" aria-label="Emoji for word '+(i+1)+'" placeholder="emoji" value="'+(isImg(o.pic) ? '' : esc(o.pic))+'" maxlength="16" autocomplete="off">' +
      '<label class="smallbtn filebtn"><span class="emoji" aria-hidden="true">📷</span>Photo<input type="file" accept="image/*" data-file="'+i+'"></label>' +
    '</div>' +
    '<input class="s" type="text" aria-label="Sentence for word '+(i+1)+'" placeholder="Sentence (optional)" value="'+esc(o.s)+'" maxlength="120">' +
  '</div>';
}
function readPicture(file, cb){
  if (!file || !/^image\//.test(file.type || '')) return cb(null);
  var r = new FileReader();
  r.onload = function(){
    var img = new Image();
    img.onload = function(){
      try {
        var S = 160, sc = Math.min(1, S / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.75));
      } catch(e){ cb(null); }
    };
    img.onerror = function(){ cb(null); };
    img.src = r.result;
  };
  r.onerror = function(){ cb(null); };
  r.readAsDataURL(file);
}
function renderEditor(msg){
  var m = draft.math;
  shell('Edit words &amp; math',
    '<div class="ed">' +
    '<div class="row" style="justify-content:flex-start; margin-top:0"><button class="smallbtn" data-act="back">'+SVG_LEFT.replace('<svg','<svg width="20" height="20"')+'Grown-ups</button></div>' +
    '<div class="edmsg" id="edTopMsg"></div>' +
    '<h2>Spelling list</h2>' +
    '<label class="lbl" for="edTitle">List title</label>' +
    '<input id="edTitle" type="text" maxlength="60" value="'+esc(draft.title)+'">' +
    '<label class="lbl" for="edPat">Letters to color blue</label>' +
    '<input id="edPat" type="text" maxlength="4" value="'+esc(draft.pattern)+'" autocapitalize="none" autocorrect="off" spellcheck="false" style="max-width:8em; font-size:26px; font-weight:700; color:var(--vowel)">' +
    '<p class="hint">This week’s vowel or pattern, like a, i, ee or sh. Leave blank to color every vowel.</p>' +
    '<p class="hint">Words: 2 to 10 letters, a to z. Sentence and picture are optional. 3 or more words works best for Word Hunt.</p>' +
    '<div id="edWords"></div>' +
    '<div class="row" style="justify-content:flex-start"><button class="btn alt" data-act="add">+ Add word</button></div>' +
    '<h2>Math</h2>' +
    '<span class="lbl">Kind of problem</span>' +
    '<div class="optrow"><button class="opt'+(m.op === '+' ? ' on' : '')+'" data-op="+">+ Add</button><button class="opt'+(m.op === '-' ? ' on' : '')+'" data-op="-">− Take away</button></div>' +
    '<div class="inline3">' +
      '<div><label class="lbl" for="edK" id="edKLbl">'+(m.op === '+' ? 'Add' : 'Take away')+'</label>'+selectHTML('edK', 1, 10, m.k)+'</div>' +
      '<div><label class="lbl" for="edFrom">From</label>'+selectHTML('edFrom', 0, MAX_NUM, m.from)+'</div>' +
      '<div><label class="lbl" for="edTo">To</label>'+selectHTML('edTo', 0, MAX_NUM, m.to)+'</div>' +
    '</div>' +
    '<p class="hint">“From” and “To” are the first number in each problem. Answers stay between 0 and '+MAX_NUM+'.</p>' +
    '<label class="lbl" for="edCustom">Or type your own problems (optional)</label>' +
    '<textarea id="edCustom" class="plain" placeholder="Example: 3+4, 10-2, 7+7" autocapitalize="none" autocorrect="off" spellcheck="false">'+esc(m.custom)+'</textarea>' +
    '<p class="hint">Separate with commas. When this box has problems, they are used instead of the settings above.</p>' +
    '<div class="preview" id="edPrev"></div>' +
    '<div class="savebar"><div class="row"><button class="btn go huge flex1" data-act="save"><span class="emoji" aria-hidden="true">💾</span>Save</button></div>' +
      '<div class="dirty" id="edDirty"></div><div class="edmsg" id="edMsg"></div></div>' +
    '<h2>Move a list to another device</h2>' +
    '<p>Tap <b>Export list</b>, copy the code, and send it to yourself (for example in Notes or a message). On the other phone or iPad, open this page, paste the code under <b>Import</b>, and tap <b>Import list</b>.</p>' +
    '<div class="row" style="justify-content:flex-start"><button class="btn alt" data-act="export">Export list</button><button class="btn alt" data-act="copy" hidden>Copy code</button></div>' +
    '<textarea id="edExport" readonly hidden aria-label="Export code"></textarea>' +
    '<label class="lbl" for="edImport">Import a list</label>' +
    '<textarea id="edImport" placeholder="Paste a code here" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea>' +
    '<div class="row" style="justify-content:flex-start"><button class="btn alt" data-act="import">Import list</button></div>' +
    '<div class="edmsg" id="edIoMsg"></div>' +
    '<h2>Start over</h2>' +
    '<p>Put back this week’s words (bag, cap, fan, jam, nap, pad, pan, rag, wax, yam) and +1 math, 1 to 12. Stars are kept.</p>' +
    '<div class="row" style="justify-content:flex-start"><button class="btn alt" data-act="defaults">Reset to this week’s defaults</button></div>' +
    '</div>');
  var wordsBox = $('#edWords');
  function drawWords(){ wordsBox.innerHTML = draft.words.map(wordRowHTML).join(''); }
  function setDirty(){ dirty = true; $('#edDirty').textContent = 'Changes are not saved yet.'; $('#edMsg').className = 'edmsg'; $('#edMsg').innerHTML = ''; }
  function showMsg(el, kind, html){ el.className = 'edmsg ' + kind; el.innerHTML = html; }
  function preview(){
    var mm = draft.math, c = mm.custom ? parseCustom(mm.custom) : {facts:[], bad:[]}, h;
    $('#edKLbl').textContent = mm.op === '+' ? 'Add' : 'Take away';
    if (c.bad.length) h = 'I can’t read: <b>' + c.bad.map(esc).join(', ') + '</b>. Write problems like 3+4 or 10-2.';
    else if (c.facts.length) h = 'Using your ' + c.facts.length + ' problems: ' + c.facts.map(factText).join(', ');
    else if (mm.from > mm.to) h = '“From” must be smaller than “To”.';
    else {
      var f = generatedFacts(mm), skipped = mm.to - mm.from + 1 - f.length;
      h = f.length ? f.length + ' problems: ' + f.slice().sort(function(x, y){ return x.a - y.a; }).map(factText).join(', ') + (skipped ? ' (skipping ' + skipped + ' that go past 0–' + MAX_NUM + ')' : '')
                   : 'No problems fit. Answers must be 0 to ' + MAX_NUM + '.';
    }
    $('#edPrev').innerHTML = h;
  }
  drawWords(); preview();
  if (dirty) $('#edDirty').textContent = 'Changes are not saved yet.';
  if (msg) showMsg($('#edMsg'), msg.kind, msg.html);

  $('[data-act=back]').onclick = function(){ go('grownups'); };
  $('#edTitle').oninput = function(){ draft.title = this.value; setDirty(); };
  $('#edPat').oninput = function(){ draft.pattern = this.value; setDirty(); };
  wordsBox.oninput = function(e){
    var t = e.target, r = t.closest ? t.closest('.wrow') : null; if (!r) return;
    var o = draft.words[+r.getAttribute('data-i')]; if (!o) return;
    if (t.classList.contains('w')) o.w = t.value;
    else if (t.classList.contains('s')) o.s = t.value;
    else if (t.classList.contains('p')){ o.pic = t.value.trim(); $('.picprev', r).innerHTML = o.pic ? picHTML(o.pic) : '<span class="none">no picture</span>'; }
    else return;
    r.classList.remove('bad'); setDirty();
  };
  wordsBox.onclick = function(e){
    var b = e.target.closest ? e.target.closest('[data-del]') : null; if (!b) return;

  };
  wordsBox.onchange = function(e){
    var t = e.target; if (!t.hasAttribute || !t.hasAttribute('data-file')) return;

      if (!url){ showMsg($('#edMsg'), 'err', 'Sorry, that picture could not be used. Try a different photo, or type an emoji.'); return; }
      if (draft.words[i]){ draft.words[i].pic = url; drawWords(); setDirty(); }

  $('[data-act=add]').onclick = function(){
    if (draft.words.length >= MAX_WORDS){ showMsg($('#edMsg'), 'err', 'The list can have up to ' + MAX_WORDS + ' words.'); return; }
    draft.words.push({w:'', s:'', pic:''}); drawWords(); setDirty();
    var inputs = $all('.wrow input.w', wordsBox), last = inputs[inputs.length - 1];

  $all('[data-op]').forEach(function(b){ b.onclick = function(){

    setDirty(); preview();
  }; });
  $('#edK').onchange = function(){ draft.math.k = +this.value; setDirty(); preview(); };
  $('#edFrom').onchange = function(){ draft.math.from = +this.value; setDirty(); preview(); };
  $('#edTo').onchange = function(){ draft.math.to = +this.value; setDirty(); preview(); };
  $('#edCustom').oninput = function(){ draft.math.custom = this.value; setDirty(); preview(); };

  function checkDraft(){
    var r = cleanList(draft);
    $all('.wrow', wordsBox).forEach(function(el){ el.classList.remove('bad'); });
    r.errors.forEach(function(er){ if (er.i != null){ var el = $('.wrow[data-i="'+er.i+'"]', wordsBox); if (el) el.classList.add('bad'); } });
    return r;
  }
  function errHTML(errs){ return 'Please fix ' + (errs.length === 1 ? 'this' : 'these') + ' first:<ul>' + errs.map(function(e){ return '<li>' + esc(e.msg) + '</li>'; }).join('') + '</ul>'; }
  $('[data-act=save]').onclick = function(){

    var ok = commitList(r.list);

  };
  $('[data-act=copy]').onclick = function(){
    var ta = $('#edExport'), io = $('#edIoMsg');
    function fallback(){ try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); var ok = document.execCommand('copy'); showMsg(io, ok ? 'ok' : 'err', ok ? 'Copied!' : 'Select the code and copy it.'); } catch(e){ showMsg(io, 'err', 'Select the code and copy it.'); } }
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(function(){ showMsg(io, 'ok', 'Copied! Now paste it on the other device.'); }, fallback); }

    var ok = commitList(r.list);
    draft = clone(LIST); dirty = false;
    renderEditor({kind: ok ? 'ok' : 'err', html:(ok ? 'Imported and saved: ' : 'Imported (but this browser could not save it for next time): ') + esc(LIST.title) + ', ' + WORDS.length + ' words, ' + FACTS.length + ' math problems.'});

  };
}

/* ---------------- Router ---------------- */
var routes = {home:home, learn:learn, build:build, hunt:hunt, math:math, quiz:quiz, grownups:grownups, edit:edit, game:game, crafts:crafts, write:write};
function route(){
  clearTimers(); Speech.stop();
  var h = (location.hash || '#home').replace('#','').split(/[?&]/)[0];
  var fn = routes[h] || home;
  if (fn !== edit){ draft = null; dirty = false; }             /* leaving the editor drops unsaved changes */
  if (fn !== edit && fn !== grownups) editUnlocked = false;   /* ask again after Luke's screens */
  if (fn === learn){ learnIdx = 0; }
  if (fn === write){ writeIdx = 0; writePass = 'trace'; }
  fn();
  if (fn === learn) later(function(){ speakWord(WORDS[learnIdx].w); }, 350);
}
window.addEventListener('hashchange', route);
fixEmoji();
loadList();
route();
})();
