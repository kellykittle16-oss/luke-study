  --radius:20px;
  --font:"Andika", Verdana, "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:20px; line-height:1.6;
  letter-spacing:.12em; word-spacing:.16em;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh; min-height:100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font-family:inherit; letter-spacing:inherit; color:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; cursor:pointer}
button:focus-visible{outline:4px solid #F2A900; outline-offset:3px}
.emoji{font-family:var(--emoji); letter-spacing:0; line-height:1; font-style:normal}
.wrap{max-width:760px; margin:0 auto; padding:12px 16px 40px}

/* Top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0 10px}
.home-btn{display:flex; align-items:center; gap:8px; background:#fff; border:3px solid var(--line); border-radius:16px; padding:8px 14px; font-size:20px; font-weight:700; min-height:56px}
.title{font-size:22px; font-weight:700; text-align:center; flex:1; line-height:1.3}
.stars{display:inline-flex; align-items:center; gap:6px; background:#fff; border:3px solid #F5D98B; border-radius:999px; padding:6px 14px; font-weight:700; font-size:22px; min-height:52px; white-space:nowrap}
.stars.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

/* Home */
.hello{font-size:44px; font-weight:700; margin:6px 0 0; line-height:1.3}
.sub{font-size:21px; color:var(--ink-soft); margin:2px 0 16px}
.modes{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.mode{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:150px; border-radius:24px; border:3px solid rgba(0,0,0,.12); box-shadow:0 5px 0 rgba(0,0,0,.14); font-size:22px; font-weight:700; padding:12px 8px; line-height:1.25; text-align:center}
.mode:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.14)}
.mode .emoji{font-size:58px}
.mode.wide{grid-column:1 / -1; min-height:120px; flex-direction:row; gap:18px}
.m-learn{background:#D4E9FF}.m-build{background:#FFE2B8}.m-hunt{background:#D8F3D2}.m-math{background:#F1DDFA}.m-quiz{background:#FFF1A8}
.grown-link{display:block; margin:26px auto 0; background:transparent; border:2px dashed #C9BB98; border-radius:14px; padding:10px 18px; font-size:18px; color:var(--ink-soft)}

/* Cards and big words */
.card{background:var(--card); border:3px solid var(--line); border-radius:28px; padding:18px 14px; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.06)}
.pic{font-size:88px; line-height:1.1; margin:4px 0}
.bigword{font-size:clamp(72px, 22vw, 150px); font-weight:700; letter-spacing:.14em; line-height:1.15; margin:4px 0}
.v{color:var(--vowel)}
.segs{display:flex; justify-content:center; align-items:center; gap:8px; margin:8px 0 4px; flex-wrap:nowrap}
.seg{min-width:72px; height:78px; font-size:44px; font-weight:700; background:#fff; border:3px solid var(--line); border-radius:16px; padding:0 8px; letter-spacing:0}
.seg.vowel{color:var(--vowel); background:var(--vowel-bg); border-color:#B9D2F1}
.seg.lit{background:#FFF3B0; border-color:#F2A900; transform:scale(1.08)}
.dash{font-size:34px; color:#999; letter-spacing:0}
.note{font-size:18px; background:var(--vowel-bg); border-radius:14px; padding:10px 12px; margin:12px 0 0; line-height:1.5; text-align:left}
.sentence{font-size:19px; color:var(--ink-soft); margin:10px 0 0}

/* Buttons */
.row{display:flex; gap:12px; justify-content:center; margin:14px 0 0; flex-wrap:wrap}
.btn{min-height:68px; padding:10px 20px; border-radius:var(--radius); border:3px solid var(--btn-dark); background:var(--btn); color:#fff; font-size:24px; font-weight:700; box-shadow:0 5px 0 var(--btn-dark); display:inline-flex; align-items:center; justify-content:center; gap:10px; line-height:1.2}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--btn-dark)}
.btn.alt{background:#fff; color:var(--ink); border-color:#BFAF8A; box-shadow:0 5px 0 #BFAF8A}
.btn.go{background:var(--good); border-color:#1D5A21; box-shadow:0 5px 0 #1D5A21}
.btn.huge{font-size:30px; min-height:84px; padding:12px 28px}
.btn.speak{font-size:26px; min-height:88px; min-width:110px; white-space:nowrap}
.btn.speak .emoji{font-size:40px}
.btn[disabled]{opacity:.45}
.btn.flex1{flex:1 1 140px}
.navrow{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px}
.navrow .count{font-size:20px; color:var(--ink-soft)}
.arrow{width:92px; min-height:72px}
.arrow svg{width:34px; height:34px}

/* Feedback */
.feedback{min-height:64px; margin:14px 0 0; border-radius:18px; padding:12px; font-size:24px; font-weight:700; text-align:center; line-height:1.35}
.feedback.good{background:var(--good-bg); color:#1D5A21}
.feedback.gentle{background:var(--gentle-bg); color:var(--gentle)}
.feedback.show{background:var(--vowel-bg); color:#173F73}
.progress{display:flex; gap:6px; justify-content:center; margin:0 0 10px; flex-wrap:wrap}
.progress i{width:14px; height:14px; border-radius:50%; background:#E7DCC2; display:block}
.progress i.done{background:var(--star)}
.progress i.now{background:var(--btn); transform:scale(1.3)}
.prompt{font-size:22px; margin:4px 0 8px; text-align:center}

/* Build the word */
.boxes{display:flex; justify-content:center; gap:12px; margin:14px 0}
.box{width:92px; height:104px; border:4px dashed #BFAF8A; border-radius:18px; background:#fff; font-size:60px; font-weight:700; display:flex; align-items:center; justify-content:center; letter-spacing:0; padding:0}
.box.filled{border-style:solid; border-color:#8FA9C9}
.box.right{border-color:var(--good); background:var(--good-bg)}
.box.v{color:var(--vowel)}
.tiles{display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin:8px auto 0; max-width:420px}
.tile{width:84px; height:88px; background:#fff; border:3px solid #BFAF8A; border-radius:18px; box-shadow:0 5px 0 #BFAF8A; font-size:52px; font-weight:700; letter-spacing:0; padding:0}
.tile:active{transform:translateY(3px); box-shadow:0 2px 0 #BFAF8A}
.tile.v{color:var(--vowel)}
.tile.used{visibility:hidden}

/* Word hunt */
.choices{display:grid; grid-template-columns:1fr; gap:14px; margin-top:14px}
.choice{min-height:96px; font-size:54px; font-weight:700; background:#fff; border:3px solid #BFAF8A; border-radius:22px; box-shadow:0 5px 0 #BFAF8A; letter-spacing:.14em}
.choice:active{transform:translateY(3px); box-shadow:0 2px 0 #BFAF8A}
.choice.faded{opacity:.35; box-shadow:none}
.choice.right{background:var(--good-bg); border-color:var(--good); box-shadow:0 5px 0 var(--good)}

/* Math */
.problem{font-size:clamp(56px, 17vw, 100px); font-weight:700; letter-spacing:0; line-height:1.1; margin:0 0 6px; white-space:nowrap}
.problem .op{margin:0 .18em}
.mathcard{padding:12px 10px}
.count-btn{font-size:17px; min-height:48px; padding:4px 12px; border-radius:14px; box-shadow:0 4px 0 #BFAF8A}
.dots-cap{display:flex; align-items:center; justify-content:center; gap:6px 12px; flex-wrap:wrap; margin:0 0 4px}
.numline .nexttxt.on{fill:#B35F00}
.grown{letter-spacing:.05em}
.problem .q{color:var(--vowel)}
.dots-area{display:flex; align-items:center; justify-content:center; gap:14px; margin:8px 0; flex-wrap:nowrap}
.dotrows{display:flex; flex-direction:column; gap:6px}
.dotrow{display:flex; gap:7px}
.dotgrp{display:flex; gap:7px; padding:5px; border-radius:12px; background:#EEF3FA}
.dotc{width:26px; height:26px; border-radius:50%; background:var(--dot); display:block; border:0; padding:0}
.dotc.plus{background:var(--dot-plus); width:34px; height:34px}
.dotc.lit{box-shadow:0 0 0 5px #F2A900}
.plus-sign{font-size:40px; font-weight:700; letter-spacing:0}
.dots-cap{font-size:19px; color:var(--ink-soft); margin:0}
.numline{width:100%; max-width:460px; display:block; margin:0 auto}
.numline text{font-family:var(--font); font-weight:700; letter-spacing:0}
.answers{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px}
.answer{min-height:100px; font-size:56px; font-weight:700; background:#fff; border:3px solid #BFAF8A; border-radius:22px; box-shadow:0 5px 0 #BFAF8A; letter-spacing:.04em}
.answer:active{transform:translateY(3px); box-shadow:0 2px 0 #BFAF8A}
.answer.faded{opacity:.35; box-shadow:none}
.answer.right{background:var(--good-bg); border-color:var(--good); box-shadow:0 5px 0 var(--good)}
.helper{background:#FFF3B0; color:var(--ink); border:3px solid #E9C95A; box-shadow:0 5px 0 #E9C95A; font-size:19px; min-height:88px; padding:8px 12px; letter-spacing:.06em}
.hop{opacity:0; transition:opacity .4s}
.hop.on{opacity:1}

/* End screen */
.end{text-align:center; padding:10px 0}
.end h2{font-size:40px; margin:6px 0; line-height:1.25}
.starrow{display:flex; flex-wrap:wrap; justify-content:center; gap:4px; font-size:36px; letter-spacing:0; line-height:1.3; margin:10px 0}
.practice-list{font-size:20px; color:var(--ink-soft)}

/* Grown-ups */
.grown{line-height:1.7; font-size:18px; text-align:left}
.grown h2{font-size:26px; margin:18px 0 6px}
.grown h3{font-size:21px; margin:16px 0 4px}
.grown p, .grown li{max-width:65ch}
.grown ul{padding-left:1.2em}
.grown table{border-collapse:collapse; width:100%; font-size:17px; background:#fff; border-radius:12px; overflow:hidden}
.grown th, .grown td{border-bottom:1px solid var(--line); padding:8px 6px; text-align:left}
.grown th{background:#F7EED8}
.tip{background:#fff; border:2px solid var(--line); border-radius:14px; padding:10px 14px; margin:10px 0}
.nospeech{background:var(--gentle-bg); color:var(--gentle); border-radius:14px; padding:10px 14px; font-size:18px; margin:10px 0; display:none}
.nospeech.on{display:block}

.fly{position:fixed; font-size:54px; pointer-events:none; z-index:50; animation:fly 1s ease-in forwards}
@keyframes fly{0%{opacity:1; transform:translate(0,0) scale(1)}100%{opacity:0; transform:translate(var(--dx), var(--dy)) scale(.4)}}

@media (min-width:700px){
  .modes{grid-template-columns:1fr 1fr 1fr}
  .mode.wide{grid-column:auto; flex-direction:column; min-height:150px; gap:6px}
  .choices{grid-template-columns:1fr 1fr 1fr}
  .answers{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:360px){
  body{font-size:18px}
  .tile{width:72px; height:80px; font-size:46px}
  .box{width:80px; height:94px; font-size:52px}
  .dotc{width:22px; height:22px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>

(function(){

var app = document.getElementById('app');
var ICON_HOME = '<span class="emoji" aria-hidden="true">🏠</span>';
var SVG_LEFT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var SVG_RIGHT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function starPill(){ return '<div class="stars" aria-label="Stars"><span class="emoji" aria-hidden="true">⭐</span><span id="starCount">'+load().stars+'</span></div>'; }
function noSpeechNote(){ return '<div class="nospeech'+(Speech.ok?'':' on')+'">Read-aloud is not available in this browser. A grown-up can read the words out loud.</div>'; }
function shell(title, inner){
  app.innerHTML = '<div class="topbar"><button class="home-btn" data-act="home" aria-label="Home">'+ICON_HOME+'<span>Home</span></button><div class="title">'+title+'</div>'+starPill()+'</div>' + noSpeechNote() + inner;
  $('[data-act=home]').onclick = function(){ go('home'); };
  window.scrollTo(0,0);
}
function go(name){ Speech.unlock(); if (location.hash === '#'+name) route(); else location.hash = name; }
function progressDots(i, n){ var h = '<div class="progress" aria-label="Question '+(i+1)+' of '+n+'">'; for (var k=0;k<n;k++) h += '<i class="'+(k<i?'done':(k===i?'now':''))+'"></i>'; return h + '</div>'; }

/* ---------------- Home ---------------- */
function home(){
  app.innerHTML =
    '<div class="topbar"><div></div>'+starPill()+'</div>' +
    '<h1 class="hello">Hi Luke! <span class="emoji" aria-hidden="true">👋</span></h1>' +
    '<p class="sub">What do you want to play?</p>' + noSpeechNote() +
    '<div class="modes">' +
      '<button class="mode m-learn" data-go="learn"><span class="emoji" aria-hidden="true">📖</span>Learn Words</button>' +
      '<button class="mode m-build" data-go="build"><span class="emoji" aria-hidden="true">🧩</span>Build the Word</button>' +
      '<button class="mode m-hunt" data-go="hunt"><span class="emoji" aria-hidden="true">🔍</span>Word Hunt</button>' +
      '<button class="mode m-math" data-go="math"><span class="emoji" aria-hidden="true">🔢</span>+1 Math</button>' +
      '<button class="mode m-quiz wide" data-go="quiz"><span class="emoji" aria-hidden="true">🏆</span>Quiz Practice</button>' +
    '</div>' +
    '<button class="grown-link" data-go="grownups">For grown-ups</button>';
  $all('[data-go]').forEach(function(b){ b.onclick = function(){ go(b.getAttribute('data-go')); }; });
}

/* ---------------- 1. Learn Words ---------------- */
var learnIdx = 0, learnedThisVisit = {};
function learn(){
  var o = WORDS[learnIdx];
  var segs = o.w.split('').map(function(c, i){
    return (i ? '<span class="dash" aria-hidden="true">-</span>' : '') + '<button class="seg'+(isVowel(c)?' vowel':'')+'" data-l="'+c+'" aria-label="sound of '+c+'">'+c+'</button>';
  }).join('');
  shell('Learn Words',
    '<div class="card">' +
      '<div class="pic emoji" aria-hidden="true">'+o.pic+'</div>' +
      '<div class="bigword" aria-label="'+o.w+'">'+colorWord(o.w)+'</div>' +
      '<div class="segs">'+segs+'</div>' +
      '<div class="sentence">'+esc(o.s).replace(new RegExp('\\b'+o.w+'\\b'), '<b>'+o.w+'</b>')+'</div>' +
      (o.nasal ? '<div class="note"><span class="emoji" aria-hidden="true">👂</span> Listen! The <b class="v">a</b> sounds a little different before <b>m</b> or <b>n</b>.</div>' : '') +
    '</div>' +
    '<div class="row">' +
      '<button class="btn speak flex1" data-act="say"><span class="emoji" aria-hidden="true">🔊</span>Hear it</button>' +
      '<button class="btn alt flex1" data-act="sound"><span class="emoji" aria-hidden="true">🐢</span>Sound it out</button>' +
    '</div>' +
    '<div class="row"><button class="btn go huge" data-act="read"><span class="emoji" aria-hidden="true">⭐</span>I can read it!</button></div>' +
    '<div class="navrow">' +
      '<button class="btn alt arrow" data-act="prev" aria-label="Back">'+SVG_LEFT+'</button>' +
      '<span class="count">'+(learnIdx+1)+' of '+WORDS.length+'</span>' +
      '<button class="btn alt arrow" data-act="next" aria-label="Next">'+SVG_RIGHT+'</button>' +
    '</div>'
  );
  var segBtns = $all('.seg');
  function lit(idx){ segBtns.forEach(function(b, i){ b.classList.toggle('lit', idx.indexOf(i) >= 0); }); }
  $('[data-act=say]').onclick = function(){ speakWordSentence(o); };
  $('[data-act=sound]').onclick = function(){
    /* sound out: first sound, then the rest (word family), then blend slowly, then say it */
    Speech.seq([
      {text: SOUND[o.w[0]], before:function(){ lit([0]); }, gap:350},
      {text: o.rime, before:function(){ lit([1,2]); }, gap:350},
      {text: o.w, rate:0.55, before:function(){ lit([0,1,2]); }, gap:300},
      {text: o.w, gap:100}
    ], function(){ lit([]); });
  };
  segBtns.forEach(function(b){ b.onclick = function(){ var c = b.getAttribute('data-l'); lit([segBtns.indexOf(b)]); Speech.say(SOUND[c], null, function(){ lit([]); }); }; });
  $('[data-act=read]').onclick = function(e){
    var fb = e.currentTarget;
    if (!learnedThisVisit[o.w]){ learnedThisVisit[o.w] = true; var d = load(); d.learned[o.w] = (d.learned[o.w]||0) + 1; save(); addStar(fb); }
    Speech.say(pick(PRAISE) + ' ' + o.w + '!', null, function(){ learnNext(); });
  };
  $('[data-act=prev]').onclick = function(){ learnIdx = (learnIdx + WORDS.length - 1) % WORDS.length; learn(); speakWord(WORDS[learnIdx].w); };
  $('[data-act=next]').onclick = function(){ learnNext(); };
  function learnNext(){ learnIdx = (learnIdx + 1) % WORDS.length; learn(); speakWord(WORDS[learnIdx].w); }
}

/* ---------------- Round runner (shared by games and quiz) ---------------- */
function runRound(cfg){
  /* cfg: {title, items:[{type, id}], quiz:bool, key} */
  var i = 0, got = 0, missed = [];
  function show(){
    if (i >= cfg.items.length) return finish();
    var it = cfg.items[i];
    shell(cfg.title, progressDots(i, cfg.items.length) + '<div id="stage"></div><div class="row" id="nextRow"></div>');
    var stage = $('#stage');
    var render = it.type === 'build' ? renderBuild : it.type === 'hunt' ? renderHunt : renderMath;
    render(stage, it.id, cfg, function(res){
      if (res.correct) got++; else missed.push(it.type === 'math' ? it.id + ' + 1' : it.id);
      var nr = $('#nextRow');
      nr.innerHTML = '<button class="btn go huge" data-act="next">Next <span aria-hidden="true">'+SVG_RIGHT.replace('<svg','<svg width="30" height="30"')+'</span></button>';
      $('[data-act=next]', nr).onclick = function(){ i++; show(); };
      later(function(){ var b = $('[data-act=next]'); if (b && b.scrollIntoView) b.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 300);
    });
  }
  function finish(){
    var n = cfg.items.length, stars = '';
    for (var k=0;k<got;k++) stars += '<span>⭐</span>';
    if (cfg.quiz){ var d = load(); d.quiz.push({date:new Date().toISOString().slice(0,10), kind:cfg.key, got:got, of:n, practice:missed}); if (d.quiz.length > 30) d.quiz = d.quiz.slice(-30); save(); }
    shell(cfg.title,
      '<div class="card end">' +
        '<div class="pic emoji" aria-hidden="true">🎉</div>' +
        '<h2>You did it, Luke!</h2>' +
        '<p style="font-size:24px;margin:0">You earned <b>'+got+'</b> '+(got===1?'star':'stars')+'!</p>' +
        '<div class="starrow emoji" aria-hidden="true">'+(stars || '<span>🌟</span>')+'</div>' +
        (missed.length ? '<p class="practice-list">Let’s practice these again: <b>'+missed.map(esc).join(', ')+'</b></p>' : '<p class="practice-list">Every single one! Wow!</p>') +
      '</div>' +
      '<div class="row"><button class="btn go huge" data-act="again">Play again</button><button class="btn alt huge" data-act="home2">'+ICON_HOME+' Home</button></div>'
    );
    $('[data-act=again]').onclick = function(){ cfg.restart(); };
    $('[data-act=home2]').onclick = function(){ go('home'); };
    Speech.say('Hooray! You earned ' + got + (got===1?' star':' stars') + '. Great work, Luke!');
  }
  show();
}

/* ---------------- 2. Build the Word ---------------- */
function makeTiles(word, extra){
  var letters = word.split(''), d = [];
  if (Math.random() < 0.4){
    var c = letters.map(function(l){ return CONFUSE[l]; }).filter(function(x){ return x && letters.indexOf(x) < 0; });
    if (c.length) d.push(pick(c)); /* at most one b/d, p/q or m/n look-alike */
  }
  var pool = POOL.filter(function(x){ return letters.indexOf(x) < 0 && d.indexOf(x) < 0 && !CONFUSE[x]; });
  while (d.length < extra){ var p = pick(pool); if (d.indexOf(p) < 0) d.push(p); }
  return shuffle(letters.concat(d));
}
function renderBuild(stage, w, cfg, done){
  var o = wordObj(w), tries = 0, finished = false;
  var tiles = makeTiles(w, cfg.quiz ? 3 : 2);
  var slots = [null, null, null]; /* each: index into tiles */
  stage.innerHTML =
    '<p class="prompt">Listen, then build the word.</p>' +
    '<div class="row" style="margin-top:0">' +
      '<button class="btn speak" data-act="say" aria-label="Hear the word"><span class="emoji" aria-hidden="true">🔊</span></button>' +
      '<button class="btn alt" data-act="sent" style="min-height:88px"><span class="emoji" aria-hidden="true">💬</span>Sentence</button>' +
    '</div>' +
    (cfg.quiz ? '' : '<div class="pic emoji" style="font-size:56px;text-align:center;margin-top:8px" aria-hidden="true">'+o.pic+'</div>') +
    '<div class="boxes">' + [0,1,2].map(function(k){ return '<button class="box" data-slot="'+k+'" aria-label="box '+(k+1)+'"></button>'; }).join('') + '</div>' +
    '<div class="tiles">' + tiles.map(function(c, k){ return '<button class="tile'+(isVowel(c)?' v':'')+'" data-tile="'+k+'">'+c+'</button>'; }).join('') + '</div>' +
    '<div class="feedback" id="fb" role="status"></div>';
  var fb = $('#fb', stage);
  function draw(){
    var used = slots.filter(function(x){ return x !== null; });
    $all('.tile', stage).forEach(function(t){ t.classList.toggle('used', used.indexOf(+t.getAttribute('data-tile')) >= 0); });
    $all('.box', stage).forEach(function(b, k){
      var c = slots[k] === null ? '' : tiles[slots[k]];
      b.textContent = c; b.classList.toggle('filled', !!c); b.classList.toggle('v', isVowel(c));
    });
  }
  $('[data-act=say]', stage).onclick = function(){ speakWord(w); };
  $('[data-act=sent]', stage).onclick = function(){ speakWordSentence(o); };
  $all('.tile', stage).forEach(function(t){ t.onclick = function(){
    if (finished) return;
    var k = slots.indexOf(null); if (k < 0) return;
    slots[k] = +t.getAttribute('data-tile'); draw();
    var c = tiles[slots[k]];
    if (slots.indexOf(null) < 0) check(); else Speech.say(SOUND[c].split(',')[0]);
  }; });
  $all('.box', stage).forEach(function(b){ b.onclick = function(){
    if (finished) return; var k = +b.getAttribute('data-slot'); if (slots[k] === null) return;
    slots[k] = null; b.classList.remove('right'); draw(); fb.className = 'feedback'; fb.textContent = '';
  }; });
  function spelled(){ return slots.map(function(x){ return x === null ? '' : tiles[x]; }).join(''); }
  function check(){
    var s = spelled();
    if (s === w){
      finished = true;
      $all('.box', stage).forEach(function(b){ b.classList.add('right'); });
      var msg = pick(PRAISE); fb.className = 'feedback good'; fb.textContent = msg + ' ' + w + '!';
      record('words', w, true, tries === 0); addStar($('.boxes', stage));
      Speech.seq([{text:msg, gap:200}, {text:w.split('').join(', '), rate:0.7, gap:250}, {text:w}]);
      done({correct:true});
      return;
    }
    tries++;
    if (tries < 2){
      fb.className = 'feedback gentle'; fb.textContent = pick(TRY);
      Speech.seq([{text: fb.textContent, gap:300}, {text:w}]);
      /* keep letters that are in the right place, gently return the others */
      $all('.box', stage).forEach(function(b, k){ if (tiles[slots[k]] === w[k]) b.classList.add('right'); });
      later(function(){ for (var k=0;k<3;k++) if (tiles[slots[k]] !== w[k]) slots[k] = null; draw(); }, 900);
    } else {
      finished = true;
      /* show the right answer */
      slots = w.split('').map(function(c){ for (var k=0;k<tiles.length;k++) if (tiles[k] === c) return k; return null; });
      draw(); $all('.box', stage).forEach(function(b){ b.classList.add('right'); });
      fb.className = 'feedback show'; fb.innerHTML = 'Good try! This is how we spell <b>'+colorWord(w)+'</b>.';
      record('words', w, false, false);
      Speech.seq([{text:'Good try! This is how we spell ' + w + '.', gap:250}, {text:w.split('').join(', '), rate:0.7, gap:250}, {text:w}]);
      done({correct:false});
    }
  }
  later(function(){ speakWord(w); }, 350);
}
function build(){
  var cfg = {title:'Build the Word', quiz:false, key:'build'};
  cfg.items = shuffle(WORDS).map(function(o){ return {type:'build', id:o.w}; });
  cfg.restart = build; runRound(cfg);
}

/* ---------------- 3. Word Hunt ---------------- */
function renderHunt(stage, w, cfg, done){
  var o = wordObj(w), tries = 0, finished = false;
  var others = shuffle(WORDS.filter(function(x){ return x.w !== w && NEAR[w].indexOf(x.w) < 0; }).map(function(x){ return x.w; }));
  var near = shuffle(NEAR[w].filter(function(x){ return !wordObj(x); }));
  var opts = shuffle([w, near[0], Math.random() < 0.5 ? others[0] : near[1]]);
  stage.innerHTML =
    '<p class="prompt">Listen. Find the word!</p>' +
    '<div class="row" style="margin-top:0">' +
      '<button class="btn speak" data-act="say" aria-label="Hear the word"><span class="emoji" aria-hidden="true">🔊</span></button>' +
      '<button class="btn alt" data-act="sent" style="min-height:88px"><span class="emoji" aria-hidden="true">💬</span>Sentence</button>' +
    '</div>' +
    '<div class="choices">' + opts.map(function(x){ return '<button class="choice" data-w="'+x+'">'+colorWord(x)+'</button>'; }).join('') + '</div>' +
    '<div class="feedback" id="fb" role="status"></div>';
  var fb = $('#fb', stage);
  $('[data-act=say]', stage).onclick = function(){ speakWord(w); };
  $('[data-act=sent]', stage).onclick = function(){ speakWordSentence(o); };
  $all('.choice', stage).forEach(function(b){ b.onclick = function(){
    if (finished || b.classList.contains('faded')) return;
    var x = b.getAttribute('data-w');
    if (x === w){
      finished = true; b.classList.add('right');
      $all('.choice', stage).forEach(function(c){ if (c !== b) c.classList.add('faded'); });
      var msg = pick(PRAISE); fb.className = 'feedback good'; fb.innerHTML = msg + ' <span class="emoji">'+o.pic+'</span>';
      record('words', w, true, tries === 0); addStar(b);
      Speech.seq([{text:msg, gap:200}, {text:w}]);
      done({correct:true}); return;
    }
    tries++; b.classList.add('faded');
    if (tries < 2){
      fb.className = 'feedback gentle'; fb.textContent = pick(TRY);
      Speech.seq([{text:fb.textContent, gap:300}, {text:w}]);
    } else {
      finished = true;
      $all('.choice', stage).forEach(function(c){ if (c.getAttribute('data-w') === w) { c.classList.remove('faded'); c.classList.add('right'); } else c.classList.add('faded'); });
      fb.className = 'feedback show'; fb.innerHTML = 'Good try! This one says <b>'+colorWord(w)+'</b>.';
      record('words', w, false, false);
      Speech.seq([{text:'Good try! This one says ' + w + '.', gap:250}, {text:w.split('').join(', '), rate:0.7, gap:250}, {text:w}]);
      done({correct:false});
    }
  }; });
  later(function(){ speakWord(w); }, 350);
}
function hunt(){
  var cfg = {title:'Word Hunt', quiz:false, key:'hunt'};
  cfg.items = shuffle(WORDS).map(function(o){ return {type:'hunt', id:o.w}; });
  cfg.restart = hunt; runRound(cfg);
}

/* ---------------- 4. +1 Math ---------------- */
function dotsHTML(n){
  var rows = [], left = n, idx = 0;
  while (left > 0){
    var take = Math.min(5, left), row = '<div class="dotrow"><span class="dotgrp">';
    for (var k=0;k<take;k++) row += '<span class="dotc" data-i="'+(idx++)+'"></span>';
    rows.push(row + '</span></div>'); left -= take;
  }
  /* two groups of five side by side when there's room (10 = 5+5) */
  return '<div class="dotrows" aria-hidden="true">' + rows.join('') + '</div>' +
         '<span class="plus-sign" aria-hidden="true">+</span>' +
         '<span class="dotc plus" data-i="'+n+'" aria-hidden="true"></span>';
}
function numlineSVG(n){
  var start = Math.max(0, n - 3), count = 8, W = 400, step = W / count, y = 62;
  var s = '<svg class="numline" viewBox="0 0 '+W+' 100" role="img" aria-label="number line">';
  s += '<line x1="6" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="#8C7F63" stroke-width="3" stroke-linecap="round"/>';
  for (var k=0;k<count;k++){
    var v = start + k, x = step*k + step/2;
    s += '<line x1="'+x+'" y1="'+(y-8)+'" x2="'+x+'" y2="'+(y+8)+'" stroke="#8C7F63" stroke-width="3"/>';
    if (v === n) s += '<circle cx="'+x+'" cy="'+y+'" r="13" fill="#2F6FB5"/>';
    if (v === n+1) s += '<circle class="hop" cx="'+x+'" cy="'+y+'" r="13" fill="#E07A00"/>';
    s += '<text'+(v===n+1?' class="nexttxt"':'')+' x="'+x+'" y="'+(y+34)+'" text-anchor="middle" font-size="24" fill="'+(v===n?'#1F5FAD':'#444')+'">'+v+'</text>';
  }
  var x1 = step*(n-start) + step/2, x2 = x1 + step;
  s += '<g class="hop"><path d="M'+x1+' '+(y-16)+' Q '+((x1+x2)/2)+' '+(y-58)+' '+(x2-4)+' '+(y-18)+'" fill="none" stroke="#E07A00" stroke-width="4" stroke-linecap="round"/>' +
       '<path d="M'+(x2-14)+' '+(y-24)+' L '+(x2-3)+' '+(y-16)+' L '+(x2-2)+' '+(y-30)+'" fill="none" stroke="#E07A00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
       '<text x="'+((x1+x2)/2)+'" y="'+(y-44)+'" text-anchor="middle" font-size="20" fill="#B35F00">+1</text></g>';
  return s + '</svg>';
}
function mathChoices(n){
  var ans = n + 1, c = [n, n+2, n+3, n-1, n+4].filter(function(x){ return x >= 0 && x !== ans; });
  c = shuffle(c.slice(0, 4)).slice(0, 3); c.push(ans);
  return c.sort(function(a,b){ return a - b; }); /* in number order: easier to scan */
}
function renderMath(stage, n, cfg, done){
  var ans = n + 1, tries = 0, finished = false;
  stage.innerHTML =
    '<div class="card mathcard">' +
      '<div class="problem" aria-label="'+n+' plus 1"><span>'+n+'</span><span class="op">+</span><span>1</span><span class="op">=</span><span class="q">?</span></div>' +
      '<div class="dots-area">'+dotsHTML(n)+'</div>' +
      '<div class="dots-cap"><span>'+n+' and 1 more</span>' + (cfg.quiz ? '' : '<button class="btn alt count-btn" data-act="count">Count with me</button>') + '</div>' +
      numlineSVG(n) +
    '</div>' +
    '<div class="row" style="flex-wrap:nowrap; margin-top:12px">' +
      '<button class="btn speak" data-act="say" aria-label="Hear the problem"><span class="emoji" aria-hidden="true">🔊</span></button>' +
      (cfg.quiz ? '' : '<button class="btn helper flex1" data-act="help"><span class="emoji" aria-hidden="true">💡</span>+1 means the next number</button>') +
    '</div>' +
    '<div class="answers">' + mathChoices(n).map(function(x){ return '<button class="answer" data-v="'+x+'">'+x+'</button>'; }).join('') + '</div>' +
    '<div class="feedback" id="fb" role="status"></div>';
  var fb = $('#fb', stage);
  function showHop(){ $all('.hop, .nexttxt', stage).forEach(function(h){ h.classList.add('on'); }); }
  function litDot(i){ $all('.dotc', stage).forEach(function(d){ d.classList.toggle('lit', +d.getAttribute('data-i') === i); }); }
  $('[data-act=say]', stage).onclick = function(){ Speech.say('What is ' + n + ' plus 1?'); };
  var help = $('[data-act=help]', stage);
  if (help) help.onclick = function(){ showHop(); Speech.say('Plus 1 means the next number. What number comes after ' + n + '?'); };
  var cnt = $('[data-act=count]', stage);
  if (cnt) cnt.onclick = function(){
    var steps = [];
    for (var k=0;k<=n;k++){ (function(k){ steps.push({text:String(k+1), rate:0.9, gap:120, before:function(){ litDot(k); }}); })(k); }
    steps[steps.length-1].text = String(n+1) + '!';
    Speech.seq(steps, function(){ litDot(-1); });
  };
  $all('.answer', stage).forEach(function(b){ b.onclick = function(){
    if (finished || b.classList.contains('faded')) return;
    var v = +b.getAttribute('data-v');
    if (v === ans){
      finished = true; b.classList.add('right'); showHop();
      $all('.answer', stage).forEach(function(c){ if (c !== b) c.classList.add('faded'); });
      $('.problem .q', stage).textContent = ans;
      var msg = pick(MATH_PRAISE); fb.className = 'feedback good'; fb.textContent = msg + ' ' + n + ' + 1 = ' + ans;
      record('math', n, true, tries === 0); addStar(b);
      Speech.seq([{text:msg, gap:200}, {text:n + ' plus 1 is ' + ans + '.'}]);
      done({correct:true}); return;
    }
    tries++; b.classList.add('faded');
    if (tries < 2){
      fb.className = 'feedback gentle'; fb.textContent = 'Try again! What comes after ' + n + '?';
      if (!cfg.quiz) showHop();
      Speech.say('Try again! What number comes after ' + n + '?');
    } else {
      finished = true; showHop();
      $all('.answer', stage).forEach(function(c){ if (+c.getAttribute('data-v') === ans){ c.classList.remove('faded'); c.classList.add('right'); } else c.classList.add('faded'); });
      $('.problem .q', stage).textContent = ans;
      fb.className = 'feedback show'; fb.textContent = 'Good try! ' + n + ' + 1 = ' + ans + '. The next number after ' + n + ' is ' + ans + '.';
      record('math', n, false, false);
      Speech.say('Good try! ' + n + ' plus 1 is ' + ans + '. The next number after ' + n + ' is ' + ans + '.');
      done({correct:false});
    }
  }; });
  later(function(){ Speech.say('What is ' + n + ' plus 1?'); }, 350);
}
function math(){
  var cfg = {title:'+1 Math', quiz:false, key:'math'};
  cfg.items = shuffle(MATH).map(function(n){ return {type:'math', id:n}; });
  cfg.restart = math; runRound(cfg);
}

/* ---------------- 5. Quiz Practice ---------------- */
function quiz(){
  shell('Quiz Practice',
    '<p class="prompt">Pick a quiz. Take your time. There is no timer!</p>' +
    '<div class="modes" style="grid-template-columns:1fr">' +
      '<button class="mode m-build wide" data-q="spell"><span class="emoji" aria-hidden="true">📝</span>Spelling Quiz<br>10 words</button>' +
      '<button class="mode m-math wide" data-q="math"><span class="emoji" aria-hidden="true">➕</span>Math Quiz<br>10 facts</button>' +
      '<button class="mode m-hunt wide" data-q="mix"><span class="emoji" aria-hidden="true">🎲</span>Mix of both<br>5 + 5</button>' +
    '</div>'
  );
  $all('[data-q]').forEach(function(b){ b.onclick = function(){ startQuiz(b.getAttribute('data-q')); }; });
  later(function(){ Speech.say('Pick a quiz. Take your time.'); }, 300);
}
function startQuiz(kind){
  var items;
  if (kind === 'spell') items = shuffle(WORDS).map(function(o){ return {type:'build', id:o.w}; });
  else if (kind === 'math') items = shuffle(MATH).slice(0, 10).map(function(n){ return {type:'math', id:n}; });
  else items = shuffle(shuffle(WORDS).slice(0,5).map(function(o){ return {type: Math.random() < 0.5 ? 'build' : 'hunt', id:o.w}; })
        .concat(shuffle(MATH).slice(0,5).map(function(n){ return {type:'math', id:n}; })));
  var names = {spell:'Spelling Quiz', math:'Math Quiz', mix:'Mix Quiz'};
  var cfg = {title:names[kind], quiz:true, key:kind, items:items};
  cfg.restart = function(){ startQuiz(kind); };
  runRound(cfg);
}

/* ---------------- Grown-ups ---------------- */
function grownups(){
  var d = load();
  function row(label, s){ s = s || {tries:0, right:0, first:0}; return '<tr><td><b>'+label+'</b></td><td>'+s.right+' / '+s.tries+'</td><td>'+s.first+'</td></tr>'; }
  var wordRows = WORDS.map(function(o){ return row(colorWord(o.w), d.words[o.w]); }).join('');
  var mathRows = MATH.slice().sort(function(a,b){return a-b;}).map(function(n){ return row(n+' + 1', d.math[n]); }).join('');
  var quizRows = d.quiz.slice(-8).reverse().map(function(q){ return '<tr><td>'+esc(q.date)+'</td><td>'+esc(q.kind)+'</td><td>'+q.got+' / '+q.of+'</td><td>'+esc((q.practice||[]).join(', ') || '—')+'</td></tr>'; }).join('');
  shell('For Grown-ups',
    '<div class="grown">' +
    '<h2>How to use this with Luke</h2>' +
    '<ul>' +
      '<li><b>Learn Words</b> first: tap <b>Hear it</b>, then <b>Sound it out</b>. Point to each letter as it lights up. Let Luke say it with the device, then tap <b>I can read it!</b></li>' +
      '<li><b>Build the Word</b>: he hears a word and taps letter tiles to spell it. Tap a filled box to take a letter back out.</li>' +
      '<li><b>Word Hunt</b>: he hears a word and picks the right spelling from 3 choices.</li>' +
      '<li><b>+1 Math</b>: dots come in groups of 5, and the number line shows the “hop” to the next number. <b>Count with me</b> counts every dot out loud.</li>' +
      '<li><b>Quiz Practice</b>: 10 items in a new shuffled order every time (the real quiz order is different from the practice sheet). No timer, same gentle help.</li>' +
    '</ul>' +
    '<div class="tip"><b>Short and often works best:</b> about 10 minutes a day, then stop while it is still fun. Say the sounds together out loud, and have him trace or write the word on paper after he builds it.</div>' +
    '<h3>This week</h3>' +
    '<p><b>Spelling, Unit 1 Week 1 (short a, CVC):</b> bag, cap, fan, jam, nap, pad, pan, rag, wax, yam.<br>Sheet hint: short <span class="v"><b>a</b></span> sounds a little different before <b>m</b> or <b>n</b> (fan, jam, pan, yam). The app points this out on those cards.</p>' +
    '<p><b>Math:</b> +1 facts, 1 + 1 through 12 + 1. The big idea: “plus 1 means the next number.”</p>' +
    '<h3>Built for a young reader with dyslexia</h3>' +
    '<ul>' +
      '<li>Andika font (made for beginning readers, with clear b, d, p, q), extra letter spacing, cream background, dark-gray text.</li>' +
      '<li>One item at a time, big buttons, no timers, no red X. After 2 tries it gently shows the answer.</li>' +
      '<li>The vowel <span class="v"><b>a</b></span> is always blue, and words are split into sounds (c - a - p).</li>' +
      '<li>Build the Word sometimes adds one look-alike letter (b/d, p/q, m/n) for gentle practice.</li>' +
    '</ul>' +
    '<h3>Sound tips</h3>' +
    '<ul>' +
      '<li>Read-aloud uses the device’s own voice (no internet needed). On iPhone/iPad, turn the volume up. If you hear nothing, check the silent switch / Focus mode and tap 🔊 again.</li>' +
      '<li>Devices can’t make perfect single letter sounds. “Sound it out” says the first sound, then the word family (b… ag… bag). Please model the short <b>a</b> sound (as in <i>apple</i>) yourself.</li>' +
      '<li>On iPhone, open this page in <b>Safari</b>. The Files app preview may not run the games. Tip: Share → <b>Add to Home Screen</b> for a one-tap icon.</li>' +
    '</ul>' +
    '<h3>Progress on this device</h3>' +
    '<p>Stars earned: <b>'+d.stars+'</b>. (Saved on this device and browser only.)</p>' +
    '<table><thead><tr><th>Word</th><th>Right / tries</th><th>First try</th></tr></thead><tbody>'+wordRows+'</tbody></table>' +
    '<br><table><thead><tr><th>Fact</th><th>Right / tries</th><th>First try</th></tr></thead><tbody>'+mathRows+'</tbody></table>' +
    (quizRows ? '<br><table><thead><tr><th>Date</th><th>Quiz</th><th>Stars</th><th>Practice</th></tr></thead><tbody>'+quizRows+'</tbody></table>' : '') +
    '<div class="row" style="justify-content:flex-start"><button class="btn alt" data-act="reset">Reset stars and progress</button></div>' +
    '</div>'
  );
  $('[data-act=reset]').onclick = function(){
    if (window.confirm('Reset all stars and progress on this device?')){ mem = blank(); save(); grownups(); }
  };
}

/* ---------------- Router ---------------- */
var routes = {home:home, learn:learn, build:build, hunt:hunt, math:math, quiz:quiz, grownups:grownups};
function route(){
  clearTimers(); Speech.stop();
  var h = (location.hash || '#home').replace('#','').split(/[?&]/)[0];
  var fn = routes[h] || home;
  if (fn === learn){ learnIdx = 0; }
  fn();
  if (fn === learn) later(function(){ speakWord(WORDS[learnIdx].w); }, 350);
}
window.addEventListener('hashchange', route);
fixEmoji();
route();
})();
</script>
